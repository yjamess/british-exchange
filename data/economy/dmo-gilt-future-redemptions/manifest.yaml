transformations: 'Read Sheet1 of the pinned .xls with xlrd. Header row 1, FY rows
  from row 2 until the first blank label. Comma-formatted strings parsed to numbers.
  One observation per FY per series; period = FY start to FY end. Values unchanged
  from the publisher; no derived totals. Self-check: conventional + index_linked ==
  published total (£1m rounding).'
revision_notes: Snapshot data-date 2026-11-14. The profile changes with every new
  issue and redemption. Rows marked provisional because DMO notes government-holdings
  data are only updated after month-end, so net figures may temporarily overstate
  before the monthly update.
caveats: 'Net of government holdings (market-hands amounts). Index-linked redemptions
  include only part of the inflation uplift; the rest sits in the CGNCR in the redeeming
  year, so IL redemptions do NOT tally with uplifted nominal in issue (see dmo-gilts-in-issue).
  Not a gilt sales / issuance forecast. Not PSND (HF6W) and not a repayment schedule
  for all public-sector debt. Gilts only: no Treasury bills, NS&I or non-gilt debt.
  This D8B export starts at FY 2027-28 and omits the remainder of the current financial
  year (2026-27); gilts maturing before April 2027 still appear in dmo-gilts-in-issue
  — do not chart D8B alone as if nothing redeems until 2027-28.'
