transformations: Download ONS adhoc xlsx. Read sheets metadata + averageprice. Keep
  rows whose Category1 is in CATEGORY1_ALLOWLIST (Food and drink, Food and drink establishments,
  Household items, Services, Health, Transport). Apply BASKET_ITEMS slug/label overrides
  for the original ten specimens. Emit one Observation per item-month with notes category=<slug>;
  item_id; item; size; category1; category2. Write curated/items.json catalogue.
revision_notes: ONS revises average prices when the shopping-tool basket updates (typically
  March). This pin is the pre-2025-update archive ending 2025-01.
caveats: Official statistics in development. Sample targets price change, not price
  levels. Never present as a single shop's shelf price. Do not mix with post-Mar-2025
  scanner-segment average prices without a new pin. Pin ends 2025-01.
