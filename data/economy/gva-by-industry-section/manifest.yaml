series_id: GDP(O) LLA · SIC sections A–T · KKP5 family
geography: United Kingdom (K02000001)
frequency: annual+quarterly
unit: £ million (current prices SA; chained volume SA)
definition: UK output gross value added (GVA) by SIC 2007 section from the ONS GDP
  output approach low-level aggregates workbook. Stores section totals A–T plus Total
  GVA in current prices (£m, SA) and chained volume (£m, SA). Current-price levels
  are suitable for additive industry shares; chained-volume levels are not strictly
  additive. Figures are output GVA and are not balanced to income/expenditure GVA.
  Not GDP at market prices.
