transformations: Download ONS gdplowlevelaggregates xlsx. From sheet 1 (current prices
  £m SA) and sheet 2a (CVM £m SA), keep Total GVA + single-letter SIC sections A–T
  only. Map annual years and YYYY Qn to ISO quarter/year bounds. Notes carry series=section
  (A–T|total), cdid, section_name, kind→category, grain. Latest valued period per
  section×kind marked provisional.
revision_notes: Revises with each GDP first estimate and QNA; Blue Book changes industry
  structure occasionally (see workbook Cover_sheet). Pin the dated xlsx under raw/<date>/;
  compare checksums.
caveats: Do not sum chained-volume section £m as if they equal Total GVA. Do not treat
  this as regional GVA (Regions owns gva-by-uk-nation-and-region). Do not fork Energy
  manufacturing-share-of-gva (L4NT CVM weights). Low-level series can be volatile
  — prefer section aggregates.
