transformations: Download ONS timeseries JSON (/data). Keep only the months array.
  Map year+month → ISO month bounds. Geography K02000001. Latest month provisional;
  older months final (LFS revises with reweighting and seasonal-adjustment updates).
revision_notes: LFS reason levels revise with reweighting and seasonal-adjustment
  updates.
caveats: LFS rolling three-month average shown as mid-month in LMS convention (e.g.
  Jun–Aug → July). LFS has known response-rate and reweighting issues — do not overinterpret
  small monthly moves. Claimant counts are not ILO unemployment. Reason levels from
  LMS / INAC01 SA (economic inactivity by reason). Sum of principal reason levels
  ≈ economic-inactivity-level (LF2M). Add inactivity-reason-discouraged (LFL8);
  published rounding can leave a small residual. Never invent levels from
  % series × LF2M. Do not draw person-flow arrows between reasons.
