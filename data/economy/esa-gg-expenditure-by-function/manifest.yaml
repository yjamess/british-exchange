indicator_id: esa-gg-expenditure-by-function
title: General government expenditure by function (ESA Table 11, OTE)
sector: economy-public-finance
publisher: Office for National Statistics
source_url: https://www.ons.gov.uk/economy/governmentpublicsectorandtaxes/publicspending/datasets/esatable11annualexpenditureofgeneralgovernment/current
series_id: ONS ESA Table 11 general government, column OTE
geography: United Kingdom general government (ESA 2010 sector S.13, geography K02000001).
  Central government plus local government plus social security funds, after consolidation.
  Excludes public corporations. Not the UK public sector used by TES.
frequency: annual
unit: £ million, nominal, calendar year
definition: 'ONS ESA 2010 Table 11, general government annual expenditure by UN COFOG,
  column OTE (total government expenditure). Calendar years 1995 to 2024, £ million,
  nominal. Ten level-1 functions plus the published total. Sub-functions are not curated.
  This is not HM Treasury Total Expenditure on Services, not a financial year, and
  not monthly EBFT. Health in calendar 2024 is 253,191. TES Health in financial year
  2024-25 is 242,429. Different year, different sector, different expenditure concept.
  The workbook coversheet says local government only. That sentence is a bad copy:
  year sheets say general government, and the 2024 OTE total 1,330,532 is not the
  local-government total 268,424 or the central-government total 1,227,604. Sibling
  files are archived for that check and are not curated.'
