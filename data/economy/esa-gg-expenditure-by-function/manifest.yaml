transformations: Download the 23 April 2026 general, central, and local government
  ESA Table 11 workbooks. Curate the general-government file only. Read calendar-year
  sheets 1995 to 2024. Keep rows _T and GF01 to GF10, column OTE only. Skip sub-function
  rows (GF0101 and below). Do not keep other transaction columns. Do not rescale onto
  TES or EBFT. Do not add central plus local to rebuild the total. Notes use series,
  classification=ote, role, calendar_year, cofog, label, table=esa-11, column=OTE,
  sector=general-government, framework=esa2010, year_basis=calendar. observation_status=final
  on this vintage. The sheet does not mark 2024 as estimated.
revision_notes: Spreadsheet published 07:00 on 23 April 2026. ONS can revise these
  calendar years in the next annual ESA Table 11. Compare sha256 before replacing
  the raw workbooks. The general-government coversheet sentence that says local government
  only is retained as evidence of the bad copy. It is not the sector of this pin.
caveats: Calendar year. General government (S.13). £ million. Column OTE. Not TES.
  Not EBFT. Not financial-year PESA. Health ESA calendar 2024 is 253,191. TES Health
  financial year 2024-25 is 242,429. Do not draw them on one axis and do not rescale
  one onto the other. Level-1 rows sum exactly to the published total in every pinned
  year. No residual function. Central government 2024 OTE total is 1,227,604 and local
  government is 268,424. Their sum is not 1,330,532, because general government consolidates
  transfers between subsectors. The coversheet says local government only. Treat that
  as a bad copy. No OSCAR rows. No Tax−Spend=Borrow identity.
status_note: Calendar years 1995 to 2024 from ONS ESA Table 11 general government,
  published 23 April 2026. Column OTE, £ million. Not a financial-year TES series.
  Later ONS editions can revise these years.
