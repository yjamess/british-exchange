transformations: OData $apply groupby CountryId × SITC/Sitc1Code with sum(Value);
  map CountryId→ISO2; Value GBP→£m; write annual observations + Storage pack partner_commodity_annual.json.
revision_notes: HMRC revises recent months. Re-run after each OTS release. See also
  https://www.uktradeinfo.com/trade-data/help-with-using-our-data/.
caveats: OTS ≠ ONS BoP SA partner totals (goods-trade-by-partner). SITC section only
  — not CN8×country. Suppressions remain in the underlying microdata; section totals
  can still move with revisions.
