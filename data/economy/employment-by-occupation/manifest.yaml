indicator_id: employment-by-occupation
title: Employment by occupation (SOC 2020 major groups, aged 16 and over)
sector: economy-public-finance
publisher: ONS via Nomis
source_url: https://www.nomisweb.co.uk/datasets/aps210/reports/employment-by-status-and-occupation?compare=K02000001
series_id: NM_17_5 variables 1815–1823 · measures 20599/21001/21002 · release 2026-10-20
geography: United Kingdom (K02000001); aged 16 and over
frequency: quarterly
unit: People, APS (share numerator); % of people in employment (share); people in
  employment (denominator). Rolling twelve-month windows.
definition: People in employment by Standard Occupational Classification 2020 major
  group (1–9), United Kingdom, aged 16 and over, from the Annual Population Survey
  on Nomis (NM_17_5, report aps210). Each window is twelve months ending in a calendar
  quarter. Stores the published share of all in employment, the published numerator
  (people) and the published denominator (all in employment). The nine groups sum
  to slightly under 100% because some respondents' occupation is not classified.
