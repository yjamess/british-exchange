transformations: Download one Nomis CSV (UK, variables 1815–1823, measures 20599 share,
  21001 numerator, 21002 denominator, all windows). Skip empty cells (windows before
  Jan–Dec 2021 carry no SOC2020 value). Window label 'Jul 2025-Jun 2026' → period_start
  first day of the start month, period_end last day of the end month. Fail if numerator
  ÷ denominator × 100 differs from the published share by more than 0.06 points, or
  if denominators differ across groups within a window. Notes carry series=people|share|employment;
  soc=1..9|all; occupation=; window=. Latest window per series marked provisional;
  older windows final.
revision_notes: 'ONS discontinued LFS table EMP04 after April–June 2018 and directs
  users to the APS on Nomis. APS estimates revise when the survey is reweighted (Nomis
  LastRevised 2023-01-27). Re-pin on each quarterly APS update (Nomis LastUpdated
  at pin: 2026-10-20).'
caveats: People, not jobs — do not compare with Workforce Jobs (JOBS02 / DYDC). APS,
  aged 16 and over, not seasonally adjusted, rolling twelve-month windows that overlap
  — compare the same window end across years. Numerators are published to the nearest
  100 and shares to one decimal place. Groups sum to about 99.5–99.8% of the denominator;
  the rest is unclassified occupation. Not the 16–64 seasonally adjusted LFS workforce.
