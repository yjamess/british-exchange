indicator_id: hmrc-tax-gap
title: HMRC Measuring tax gaps (The Tax Gap)
sector: economy-public-finance
publisher: HMRC
source_url: https://www.gov.uk/government/statistics/measuring-tax-gaps-tables
series_id: MTG-online-tables-2026
geography: United Kingdom (K02000001); HMRC-administered taxes/duties only (excl.
  Crown dependencies; not local council tax as a separate head beyond HMRC coverage)
frequency: annual (tax year)
unit: £ billion and percent of theoretical tax liabilities (by series)
definition: 'HMRC estimate of the tax gap: difference between the amount of tax that
  should, in theory, be paid to HMRC and what is actually paid. Pinned from Measuring
  tax gaps 2026 edition online tables for tax years 2005–06 to 2024–25 (excise components
  may start earlier in source). Includes tax-type (Tables 1.1/1.2), customer group
  (1.3), and illustrative behaviour (7.1). Not observed fraud incidents.'
