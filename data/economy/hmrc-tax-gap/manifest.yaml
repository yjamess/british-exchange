transformations: Download MTG 2026 online tables xlsx + summary/behaviour/annex/quality
  HTML. Parse xlsx via zipfile/XML (broken drawing relationships break openpyxl normal
  load). Curate Tables 1.1 (%), 1.2 (£bn), 1.3 (customer group), 7.1 (illustrative
  behaviour). Tax-year periods use 6 Apr–5 Apr. Values '<0.1' stored as suppressed/null
  with raw= in notes. Dimensions in notes as key=value.
revision_notes: Pinned vintage MTG-2026, official release 2026-06-23. Each MTG edition
  revises prior years — do not mix editions. 2023–24 and 2024–25 are projections.
  CT series has a 2019–20 methodological/data step. Behaviour series starts 2019–20.
caveats: 'HMRC Measuring tax gaps estimate of the difference between theoretical tax
  liabilities and tax paid. The gap is **not** the same as deliberate fraud: published
  behaviour categories include avoidance, criminal attacks, error, evasion, failure
  to take reasonable care, hidden economy, legal interpretation, and non-payment.
  Estimates are modelled/administrative — not observed incidents. Methodology breaks:
  ct-step-2019-20; behaviour-series-start; projection-years; note-comparability; gap-not-fraud.'
