transformations: Download ONS timeseries JSON (/data). Keep only the months array.
  Map year+month → ISO month bounds. Geography K02000001. Latest month provisional;
  older months final (LFS revises with reweighting and seasonal-adjustment updates).
revision_notes: LFS reason percentages revise with reweighting and seasonal-adjustment
  updates.
caveats: LFS rolling three-month average shown as mid-month in LMS convention (e.g.
  Jun–Aug → July). LFS has known response-rate and reweighting issues — do not overinterpret
  small monthly moves. Claimant counts are not ILO unemployment. NOT A LEVEL. Percent
  of inactive people (denominator = economically inactive aged 16–64), not a count
  and not a share of the whole population. Do not multiply LF77 by LF2M. Published
  to one decimal place on the LMS timeseries (INAC01 workbook holds a fuller percentage).
