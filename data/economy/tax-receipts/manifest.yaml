transformations: Download ONS timeseries JSON (/data). Keep only the months array
  (quarters/years kept in raw, not curated). Map year+month name → ISO calendar-month
  bounds. Geography fixed to K02000001 / United Kingdom. Values parsed as float; empty
  → missing. observation_status=provisional (PSF monthly estimates are routinely revised).
revision_notes: Public Sector Finances (PUSF) monthly estimates revise as administrative
  data arrive and methods change. Re-fetch and re-pin raw JSON; compare checksums.
  Record official_release_date from description.releaseDate.
caveats: Legacy api.ons.gov.uk retired 2024-11-25; ingest uses website timeseries
  JSON. Headline fiscal measures often quoted as financial-year-to-date sums — this
  package stores period (month) levels only. Quarterly/annual aggregates exist in
  raw JSON but are not written to curated observations. Not HMRC cash tax receipts
  and not ANBT (total current receipts, which includes non-tax income). AHHY = taxes
  + NICs only.
