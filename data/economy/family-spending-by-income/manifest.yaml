  Parse Table 3.1E5 and 3.2E5 left blocks (columns Lowest…All). Headline rows only.
  Skip the right-hand 1-adult-reference comparison block. Do not curate WB2 Tables
  3.3E/3.7E (non-retired 1-adult / 2-adult subsets).
revision_notes: FYE 2025 changed equivalisation from a one-adult to a two-adult OECD
  reference. Do not splice pre-FYE 2025 equivalised tables without a labelled break.
  Workbook 1 SEs for FYE 2023–24 Table A1 were corrected 11 Jun 2026; this pin is
  the FYE 2025 edition.
caveats: LCF private households; sample 5,000 households in FYE 2025. Quintile averages
  are not any household’s budget. Housing (net) excludes mortgage interest, Council
  Tax and NI rates. Do not reconcile these £ with Domain 06 ETB incomes/taxes or UKEA
  RHDI / DGD8 into one ledger. ETB may be shown adjacent only.
