indicator_id: family-spending-by-income
title: Family spending by equivalised disposable-income quintile
sector: economy-public-finance
publisher: ONS
source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/expenditure/datasets/familyspendingworkbook2expenditurebyincome
series_id: Family Spending workbook 1 Tables 3.1E5 + 3.2E5 (2-adult OECD)
geography: United Kingdom (K02000001); private households (LCF)
frequency: annual (financial year)
unit: £ per week (household average) | percent of total expenditure
definition: ONS Family Spending FYE 2025. Curates Workbook 1 Table 3.1E5 (average
  weekly £) and Table 3.2E5 (percent of total expenditure) for sequential headline
  groups 1–13, the 1–12 subtotal, and total, by equivalised disposable-income quintile
  for all households. Ranking uses the modified OECD scale with a two-adult reference
  household (FYE 2025 methodology update; left-hand published block). £ figures are
  unequivalised household means. Workbook 2 is the income-landing pin; all-households
  equivalised quintiles live in workbook 1, not workbook 2.
