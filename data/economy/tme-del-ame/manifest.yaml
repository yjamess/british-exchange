  Table TME notes set denominator=hmt-table-tme.
revision_notes: PSS July 2026, file updated 2026-07-29. Outturn only — PESA plan years
  2026-27 to 2028-29 are not in this workbook and are not in this pin. 2025-26 is
  the first estimate and can still be revised.
caveats: 'Denominator is this table''s TME, not monthly EBFT and not TES. In 2024-25,
  Total DEL 595,892 + Departmental AME 605,568 + Other AME 88,552 = table TME 1,290,012.
  Dropping Other AME leaves the total short by 88,552. Resource DEL 469,578 + capital
  DEL 111,587 = 581,165, which is not Total DEL 595,892 (footnote 6: Scottish Government
  block grant adjustments sit outside that pair). 2021-22 Other AME is -167,119. No
  Tax−Spend=Borrow identity. No OSCAR rows. No PESA plan years. Central government
  gross debt interest sits inside Other AME and is not merged with public-sector-debt-interest
  (NMFX). These totals are HMT financial-year table TME / TES, not monthly ONS EBFT
  (total-managed-expenditure, PSF 2026-10-20). Derived April–March sums of that Ready
  pin: 2023-24 summed EBFT 1,258,195 vs HMT table TME 1,230,807 (difference 27,388);
  2024-25 summed EBFT 1,294,828 vs HMT table TME 1,290,012 (difference 4,816). Different
  vintage, the HMT footnote excluding temporary effects of banks classified to the
  public sector, and a derived monthly sum rather than an official financial-year
  series. Do not rescale COFOG or DEL shares onto EBFT.'
status_note: Financial-year outturn for 2021-22 to 2025-26 from PSS July 2026. 2025-26
  is a first estimate and can still be revised.
