definition: 'HM Treasury control totals from PSS July 2026 Table 1.1, financial-year
  outturn, £ million, nominal. Curated rows are the published Total DEL, Departmental
  AME, Other AME, and this table''s Total Managed Expenditure. Identity: Total DEL
  + Departmental AME + Other AME = this table''s TME. Other AME is kept, including
  when it is negative. Total DEL is the published row, not resource DEL plus capital
  DEL. The denominator is this table''s TME, not monthly ONS EBFT, and not TES.'
