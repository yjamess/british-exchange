transformations: Download PSS July 2026 Chapter 1. Read sheet Table_1_1 only. Keep
  financial years 2021-22 to 2025-26. Curate Total DEL, Departmental AME, Other AME,
  and table TME from the published of-which block. Do not curate resource or capital
