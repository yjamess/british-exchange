transformations: Download ONS timeseries JSON (/data). Keep only the months array.
  Map year+month → ISO month bounds. Geography K02000001. Latest month provisional;
  older months final (LFS revises with reweighting and seasonal-adjustment updates).
revision_notes: LFS estimates revise with reweighting and seasonal-adjustment updates;
  check the labour-market bulletin notes on every re-pin.
caveats: LFS rolling three-month average shown as mid-month in LMS convention (e.g.
  Jun–Aug → July). LFS has known response-rate and reweighting issues — do not overinterpret
  small monthly moves. Claimant counts are not ILO unemployment. Aged 16–64 rate of
  population, not 16+. Do not add to inactivity rate and unemployment rate as a population
  composition — unemployment uses the economically active denominator. Flagship composition
  needs matched counts (LF2G / LF2I / LF2M).
