transformations: Download ONS timeseries JSON (/data). Keep only the months array.
  Map year+month → ISO month bounds. Geography K02000001. Latest month provisional;
  older months final (LFS revises with reweighting and seasonal-adjustment updates).
revision_notes: LFS hours revise with reweighting and seasonal-adjustment updates.
caveats: LFS rolling three-month average shown as mid-month in LMS convention (e.g.
  Jun–Aug → July). LFS has known response-rate and reweighting issues — do not overinterpret
  small monthly moves. Claimant counts are not ILO unemployment. Average hours across
  workers with a main and/or second job — not total hours (YBUS) and not FT-only (YBUY).
  Underemployment / FT–PT packs are separate EMP01 series if ingested later.
