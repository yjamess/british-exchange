transformations: 'Parse every ''Financial Year'' block of the D4L .xls (ISIN rows
  × month columns named by each block''s header). Blank cells skipped. Sum gilts per
  month: total, conventional, index-linked (name contains ''Index-linked''). notes:
  series=<total|conventional|index-linked>; holder=CRND+DMO; valuation=nominal. Latest
  month per series marked provisional. Latest per-gilt month-end snapshot in curated/latest_snapshot_by_gilt.csv
  (side file, not observations).'
revision_notes: Browser export pinned 14 Nov 2026 (data date 14 Nov 2026; latest month
  column Oct 2026). Re-pin monthly. Earlier months may be restated by DMO.
caveats: 'NOMINAL, official holdings only: ≠ ONS market-value sector holdings (gilt-holdings-by-sector),
  ≠ gilts in issue, ≠ PSND (HF6W). The file does not state whether index-linked rows
  are inflation-uplifted. Validation evidence (D11b) says they are NOMINAL (not uplifted):
  D4L index-linked is ~£2.1bn while the QR gross-minus-net gap is ~£5.0bn uplifted,
  and D4L x the D1A uplift ratio lands within ~3% of that gap. DMO has not confirmed
  this, so never add D4L index-linked to uplifted totals. Bank of England APF gilts
  are NOT in this series. Totals are Exchange-derived sums of gilt rows (the file
  has no total row), not a DMO-published figure.'
status_note: 'Validation pass with warnings (qa_report_economy_08_debt_ownership_2026-11-14.md):
  777/777 values re-summed from the raw xls; conventional ties to QR gross-minus-net
  within £0.01bn. Warning: index-linked basis is evidence-based (nominal), DMO confirmation
  pending.'
