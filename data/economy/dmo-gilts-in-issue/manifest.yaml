transformations: Read Sheet1 of the pinned .xls with xlrd. Locate the conventional
  and index-linked header rows by text; rows whose 2nd cell is an ISIN are gilts.
  One series=nominal row per gilt; index-linked gilts also get series=uplifted_nominal.
  Self-check vs headline £2,939.04bn written to curated/headline_check.json. No aggregates
  are curated.
revision_notes: As-of 2026-11-13 (data-date 2026-11-14). Amounts change with every
  operation; the index-linked uplift changes monthly with RPI. The 3-month lag uplift
  uses the index ratio for the business day after the report day.
caveats: Nominal (face) and uplifted-nominal amounts — not market value and not who
  owns gilts. A single working-day snapshot, not a time series. Not PSND (HF6W); gilts
  only (no Treasury bills, NS&I, or other public-sector debt). Includes gilts held
  by official holders (DMO/CRND) — gross, unlike D8B redemptions which are net of
  government holdings. Conventional gilts have no uplifted figure. Do not sum nominal
  across kinds as a debt total.
