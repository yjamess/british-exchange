transformations: >-
  Download HMRC ODS (Tables A.1, A.2, A.4), GOV.UK HTML landings, and
  gov.scot / HMRC Scottish Income Tax HTML. Parse ODS with stdlib zip/XML. Map HMRC
  taxable-income windows to after-allowance bands (1→N as 0→N; Over X as lower X+1).
  Scotland 2017–22 from gov.scot/HMRC SIT gross tables mapped to after-allowance (PA-relative
  lower bands; £150,000 absolute higher/top per employers/SRR convention); never copy
  E/W/NI. Scotland 2023–27 from GOV.UK after-allowance table; 2010–16 mirrors E/W/NI.
  NICs weekly figures retained; weekly×52 documented as educational annual equivalent
  only. Intra-year NICs rate cells kept as published text without inventing a single
  annual rate. Fiscal-drag examples pin ONS AWE KAI7 JSON; tax-year mean×52 path;
  ≤3 hypothetical profiles vs curated statutory bands (Scotland separate).
revision_notes: '2026-11-15: filled Scotland 2017–18…2022–23 from gov.scot / HMRC
  SIT. Do not invent freezes or mid-year blends. 2026-11-15b: fiscal-drag examples
  from ONS KAI7 (EMP release 2026-10-19); Scotland 2017–22 band rows unchanged.'
caveats: 'Educational illustration of dated statutory income-tax and employee Class
  1 NICs rules — not tax advice and not a substitute for HMRC guidance or a personal
  tax calculation. Hypothetical taxable employment income only; Scotland uses a labelled
  alternate band table. Statutory incidence (who the law charges) is not the same
  as economic incidence (who ultimately bears the cost). Modelled liabilities are
  not observed population tax paid. Exclusions: savings starting-rate band (out of
  NSND employment focus); dividend rates / dividend allowance; marriage / blind person''s
  / age-related allowances as modelled reliefs; employer Class 1 NICs; non-A NICs
  category letters; interactive fiscal-drag calculator UI; corporation tax, VAT, CGT,
  council tax. Fiscal drag examples pinned (educational KAI7 path); Validation ask
  EC-VAL-06E-DRAG — not a Ready flip by itself. Scotland Personal Allowance remains
  the reserved UK PA (HMRC Table A.1) — gov.scot tables state this. AWE KAI7 is GB
  only (excludes Northern Ireland) and is regular pay, not take-home pay.'
status_note: Time Machine history (+ Scotland 2017–22 + fiscal-drag examples). Fiscal
  drag Validation ask EC-VAL-06E-DRAG. No fiscal-drag UI this pass.
