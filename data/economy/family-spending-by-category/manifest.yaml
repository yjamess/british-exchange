series_id: Family Spending workbook 1 · Table 4.1 · FYE 2025
geography: United Kingdom (K02000001); private households (LCF)
frequency: annual (financial year; calendar years 2006–2014)
unit: £ per week (household average, FYE 2025 prices)
definition: ONS Family Spending / Living Costs and Food Survey. Table 4.1 average
  weekly household expenditure on sequential headline groups 1–13 (food through other
  items), the 1–12 subtotal, and total expenditure, all households, UK. Values are
  deflated to FYE 2025 prices using COICOP-specific CPI deflators (publisher note
  1). Housing (net), fuel and power excludes mortgage interest, Council Tax and Northern
  Ireland rates (those sit in group 13 / other items). Survey means — not a median
  household and not a CPI inflation basket.
