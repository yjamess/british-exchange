  edition workbook and compare checksums.
caveats: LCF private households only. Small samples; lower-level items are noisier
  than headline groups. Categories are not comparable with publications before 2001-02.
  Communication changes from FYE 2019. COVID collection/weighting in 2020-21. HFS
  weighting from 2022-23; Census 2021 weights from FYE 2024. Two 2006 columns use
  different census bases. Not ETB, not UKEA RHDI, not CPI/CPIH. Domain 01 owns inflation;
  Housing/Energy own bills.
