transformations: 'Download EMP16 xls. From sheet Levels keep ''Underemployment level''
  and ''Total in employment''. From sheet Rates keep ''Underemployment rate1'' (footnote
  1: share of total employment, no adjustment for unknowns). Map Jan-Mar / Apr-Jun
  / Jul-Sep / Oct-Dec to calendar quarters. Do not divide by 1,000. Fail if level
  / employment × 100 misses the published rate by more than 0.0001 percentage points.
  Notes: series=underemployment_level|employment_level|underemployment_rate; adjustment=NSA;
  age=16+. Latest quarter per series marked provisional. Publication date read from
  the workbook. Footnote digits glued onto a year (''Jan-Mar 20191'' on Levels, ''Jan-Mar
  20194'' on Rates) are 2019 Q1; notes keep source_label.'
revision_notes: LFS underemployment revises when the survey is reweighted. EMP16 is
  not seasonally adjusted — compare the same quarter across years (ONS note on the
  sheet). January–March 2019 onward has a reweighting step change. This pin's file
  is emp16aug2026.xls.
caveats: 'NSA, aged 16 and over, quarterly. Not the 16–64 SA labour market. Not involuntary
  part-time (involuntary-part-time / YCCX: could not find a full-time job, thousands,
  SA). Not all part-time employment (YCBH). Cells are people even though the banner
  says thousands — do not divide by 1,000. The rate''s denominator is total employment,
  including people whose underemployment status is unknown (EMP16 footnote 1). Overemployment
  and the hours sub-components are not curated.'
