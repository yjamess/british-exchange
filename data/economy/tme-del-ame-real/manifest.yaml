definition: 'HM Treasury control totals from PSS July 2026 Table 1.2, financial-year
  outturn, £ million, 2025-26 prices. Curated rows are the published Total DEL, Departmental
  AME, Other AME, and this table''s Total Managed Expenditure. Identity: Total DEL
  + Departmental AME + Other AME = this table''s TME. Other AME is kept, including
  when it is negative. Total DEL is the published row, not resource DEL plus capital
  DEL. In 2025-26, real equals nominal Table 1.1, including resource DEL 496,670.
  Real-terms figures are the nominal figures adjusted to 2025-26 price levels using
  GDP deflators from the Office for National Statistics (released 30 June 2026). PESA
  plan years are not in these pins. Where PESA prints plan years, it also uses OBR
  GDP deflator forecasts from the 3 March 2026 Economic and fiscal outlook. That forecast
  deflator is not applied here. The denominator is this table''s real TME, not monthly
  ONS EBFT.'
