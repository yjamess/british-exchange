definition: Monthly amounts outstanding of sterling consumer credit lending to individuals,
  excluding the Student Loans Company, seasonally adjusted £ million. LPMBI2O is the
  headline total; LPMVZRJ is credit cards; LPMB4TS is other unsecured consumer credit
  (overdrafts and other loans/advances). Bankstats Table A5.6 / Money and Credit.
  Lender stocks, not a survey of household debt, not mortgage rates, not the FCA MLAR
  book.
