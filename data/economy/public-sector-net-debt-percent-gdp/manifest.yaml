frequency: monthly
unit: '% of GDP, NSA (ex public sector banks)'
definition: 'Public sector net debt excluding public sector banks as a percentage
  of GDP, not seasonally adjusted. ONS CDID HF6X in PUSF; live series title ''PS:
  Net Debt (excluding public sector banks) as a % of GDP: NSA'', ONS unit ''%''. Official
  ONS ratio: numerator is PSND (HF6W concept); denominator is nominal GDP summed over
  a centred 12-month window (6 months either side of the debt date; monthly GDP =
  quarterly / 3), using OBR forecasts for the latest quarters.'
