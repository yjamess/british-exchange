definition: UK workforce jobs by SIC 2007 section, seasonally adjusted, thousands
  of jobs. ONS table JOBS02, sheet 'WFJ SA'. Includes sections A–T and the published
  all-jobs total (A–T column). Does not store shares of that total. Jobs (employer
  surveys plus LFS components) are not LFS employed people. Section C is the same
  published series as Energy manufacturing-employment (JWR7); this pack is not a second
  manufacturing indicator.
