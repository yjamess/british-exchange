transformations: 'Download JOBS02 xls. Keep sheet WFJ SA. Map Mar/Jun/Sep/Dec YY to
  calendar quarters (Mar=Q1 … Dec=Q4). Two-digit years: 70–99 → 19xx, 00–69 → 20xx.
  Keep SIC letters A–T (kind=section) and the A–T all-jobs column (series=total, kind=total).
  Skip the G–T services aggregate. Notes carry series, section_name, kind, component=workforce_jobs,
  adjustment=SA, release_marker. Section C notes linked_indicator=manufacturing-employment.
  No share of DYDC is calculated. Workbook typos ''Mar 193'' and ''Mar 204'' are mapped
  to 2019 Q1 and 2020 Q1 (neighbours and the all-jobs total); notes keep source_label.
  Latest quarter per series is provisional. Fail if a quarter is missing or section
  levels miss the published total by more than 5 thousand.'
revision_notes: 'Workforce jobs revise with quarterly sources and the annual December
  benchmark. JOBS02 file name changes each edition (this pin: jobs02sep2026.xls, release
  2026-09-15). (p) on a quarter is the ONS provisional marker; (r) means revised and
  is still stored as final once a later quarter exists.'
caveats: Jobs ≠ people. Do not add these levels to LFS employment (LF2G). Do not invent
  industry shares of workforce-jobs (DYDC) — the total is already in series=total.
  Section sum can differ from that total by rounding (about 1 thousand). Section C
  links Energy manufacturing-employment (JWR7). Do not fork BRES (bres-manufacturing-employee-jobs-by-region)
  — that is regional employee jobs, not this national workforce jobs series. March
  2019 onwards has an LFS-reweighting step change (JOBS02 footnote). The Sep 2026
  file labels 2019 Q1 as 'Mar 193' and 2020 Q1 as 'Mar 204'; those two labels are
  corrected from their neighbours and stored in source_label. Sheet unit is thousands.
