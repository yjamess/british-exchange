transformations: 'pypdf text extraction of the QR ''Gilt and Treasury Bill Holdings''
  page; regex row parse (label + four quarterly £mn values + latest-quarter %); self-check
  sum(sectors)==TOTAL within rounding and printed % vs computed. One row per sector×quarter
  plus TOTAL. notes: series=<sector slug>; sector=…; component=sector|total; valuation=market-value.
  Latest quarter per series marked provisional.'
revision_notes: 'ONS: ''These figures can be revised retrospectively.'' Each QR restates
  recent quarters; re-pin newer QRs and let the latest QR win for overlaps. Pinned
  QR: Oct-Dec 2025 (quarters Q4 2024 – Q3 2025). Method note: only the latest quarter
  per series is flagged provisional, but ONS can revise any earlier quarter in the
  QR too, so ''final'' on Q4 2024 – Q2 2025 means ''final in this QR vintage'', not
  ''will never change''. Any display should say figures may be revised retrospectively.'
caveats: 'MARKET VALUE, not nominal: ≠ gilts in issue (D1A), ≠ uplifted-nominal debt
  portfolio, ≠ public-sector net debt (HF6W), ≠ DMO/CRND official holdings (D4L).
  Overseas % is a share of gilt market value, not of PSND. ''Other financial institutions
  and PNFC'' is a large mixed residual (funds, dealers, hedge funds). Sector names
  have changed over time; Bank of England''s discontinued 2002 sector table is NOT
  used. ONS figures can be revised retrospectively; earlier quarters in the QR may
  still revise (see revision_notes).'
