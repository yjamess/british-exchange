transformations: 'pypdf text extraction of QR pages 1-2; regex row parse; every printed
  £bn cell kept as one observation. series=<valuation>-<basis>-<instrument>; valuation=uplifted-nominal|market-value;
  basis=gross|net; instrument=total|conventional-gilts|index-linked-gilts|treasury-bills.
  Self-check: total == sum of instruments (±£0.02bn); net ≤ gross.'
revision_notes: 'Pinned QR: Oct-Dec 2025. Only the quarter-ends printed in that QR
  are curated (uplifted nominal Mar/Jun/Sep/Dec 2025; market value Sep/Dec 2025).
  The DMO website holds the full quarterly history (data section). Method note: all
  rows are ''final'' in this QR vintage, but DMO can revise earlier quarters (QR footnote
  3 on T-bill history) and a newer QR may restate them; ''final'' means ''as printed
  in this QR'', not ''never revised''.'
caveats: Uplifted nominal ≠ market value ≠ nominal in issue (D1A) ≠ PSND (HF6W); never
  sum across valuations. Excludes the £500m UK Sovereign Sukuk. T-bills are debt-management
  only (cash-management T-bills excluded from QR statistics since June 2016). Conventional
  gilts include green gilts (£49.6bn at Dec 2025 per QR footnote 4). Average maturity,
  yields and duration printed in the QR are NOT curated here. Earlier quarters in
  the QR may still be revised by DMO (see revision_notes).
