  (ONS revises).
revision_notes: Workforce jobs revise with QBS/QPSES/LFS inputs and annual benchmarking
  (typically December). Prefer JOBS02 for industry breakdown; link Energy manufacturing-employment
  — never fork.
caveats: Jobs ≠ people in employment. One person can hold more than one job. National
  total only. Industry sections are workforce-jobs-by-industry (JOBS02 levels,
  not shares). Section C is the same published series as Energy
  manufacturing-employment (JWR7). Do not fork that indicator. BRES stays
  with Energy.
