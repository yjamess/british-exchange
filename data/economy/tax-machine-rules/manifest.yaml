transformations: Download GOV.UK HTML snapshots. Curated CSV/JSON tables are typed
  extractions of published allowances, bands (income after allowances), and annual
  Class 1 employee thresholds/rates. Worked examples recompute liabilities from curated
  tables with documented exclusions. observations.csv stores key rule parameters as
  Observation rows (dimensions in notes).
revision_notes: Re-fetch HTML when HMRC updates rates pages. Do not invent missing
  years. Scotland and E/W/NI must stay labelled separately.
caveats: 'Educational illustration of dated statutory income-tax and employee Class
  1 NICs rules — not tax advice and not a substitute for HMRC guidance or a personal
  tax calculation. Hypothetical taxable employment income only; Scotland uses a labelled
  alternate band table. Statutory incidence (who the law charges) is not the same
  as economic incidence (who ultimately bears the cost). Modelled liabilities are
  not observed population tax paid. Exclusions: benefits in kind; pension contributions
  / relief; marriage allowance; blind person''s allowance; student loan repayments;
  savings / dividend income (starting rate for savings and dividend rates out of scope);
  personal allowance taper for income above £100,000 (examples stay at or below £100,000);
  employer Class 1 NICs (employer stage not modelled); married women''s reduced NICs
  rates / other category letters (category A only); corporation tax, VAT, CGT, council
  tax. Kickoff preferred years were 2025–26 / 2024–25; this pin uses current + one
  prior on 2026-11-15 retrieval → 2026–27 + 2025–26 (both published on GOV.UK).'
status_note: Statute pin Ready (Validation PASS 2026-11-15). Tax Machine calculator
  UI still Review Gate only — educational not advice.
