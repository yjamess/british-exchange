transformations: Download PSS July 2026 Chapter 5. Read sheet 5_4 only. Keep financial
  years 2021-22 to 2025-26. Curate ten COFOG level-1 functions (current and capital),
  EU transactions, published TES totals (current, capital, total), accounting adjustments
  (current, capital, total), and table TME. Skip of-which lines. Do not curate public-sector
  current or capital expenditure as extra slices; those published bridges are checked
  in self-QA. 2025-26 observation_status=estimated (first estimate). Notes use series,
  classification, role, fy, cofog, label, table=5.4. Table TME notes set denominator=hmt-table-tme.
revision_notes: PSS July 2026, file updated 2026-07-29. 2025-26 is the first outturn
  estimate because not every department had published its annual report. Later PSS
  editions can revise these years. Compare sha256 before replacing the raw workbook.
caveats: 'Label this TES / COFOG, not a split of monthly EBFT and not services equal
  to TME. In 2024-25, TES is 1,166,452 and table TME is 1,290,012; the gap is accounting
  adjustments of 123,560. EU transactions in 2024-25 are -1,412 on the current side,
  so the ten functions are not TES on their own. Defence is the UN COFOG definition,
  not the NATO definition. Public-sector debt interest sits inside General public
  services and is not a separate curated function. No Tax−Spend=Borrow identity. No
  OSCAR rows. No PESA plan years. No invented residual for the £0–2 million leaf gap.
  These totals are HMT financial-year table TME / TES, not monthly ONS EBFT (total-managed-expenditure,
  PSF 2026-10-20). Derived April–March sums of that Ready pin: 2023-24 summed EBFT
  1,258,195 vs HMT table TME 1,230,807 (difference 27,388); 2024-25 summed EBFT 1,294,828
  vs HMT table TME 1,290,012 (difference 4,816). Different vintage, the HMT footnote
  excluding temporary effects of banks classified to the public sector, and a derived
  monthly sum rather than an official financial-year series. Do not rescale COFOG
  or DEL shares onto EBFT.'
status_note: Financial-year outturn for 2021-22 to 2025-26 from PSS July 2026. 2025-26
  is a first estimate and can still be revised.
