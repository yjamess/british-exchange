frequency: annual
unit: £ million, nominal, financial year
definition: HM Treasury Total Expenditure on Services (TES) by UN COFOG level 1, from
  PSS July 2026 Table 5.4. Financial-year outturn, £ million, nominal. Ten functions
  each have current and capital rows. EU transactions keep the published sign and
  sit inside TES but outside the ten functions. The published TES total is stored
  because level-1 leaves can miss it by £0–2 million. Accounting adjustments are the
  bridge from TES to this table's Total Managed Expenditure. They are not a function.
  This table's TME is not monthly ONS EBFT and is not 'services people receive'.
