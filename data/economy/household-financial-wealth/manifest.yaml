indicator_id: household-financial-wealth
title: Household financial wealth
sector: economy-public-finance
publisher: Office for National Statistics
source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/incomeandwealth/datasets/financialwealthwealthingreatbritain
series_id: WAS Tables 5.1, 5.10, 5.11, 5.12, 5.13
geography: Great Britain (K03000001) — not United Kingdom
frequency: ad_hoc
unit: £, percent of households, or £ billion
definition: ONS Wealth and Assets Survey financial wealth for Great Britain. Net financial
  wealth is formal and informal financial assets minus financial liabilities (not
  property, not pensions). Curates Table 5.10 percentiles (all households and households
  with assets or liabilities), Table 5.11 band shares, Table 5.1 coverage of formal
  financial assets, Table 5.12 aggregate £ billion stocks, and Table 5.13 percentiles
  by equivalised income decile. Distribution of household financial buffers — not
  the national-accounts saving ratio (DGD8).
