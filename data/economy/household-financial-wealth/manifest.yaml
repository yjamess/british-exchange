  figures. Round 8 weights were recalibrated for tenure during COVID telephone fieldwork.
  DGD8 household-saving-ratio is a national-accounts residual, not this survey buffer.
  Do not fork Housing household-net-property-wealth. July 2006–June 2016 and April
  2014–March 2022 round systems overlap — do not splice as one continuous series without
  labelling the break.
