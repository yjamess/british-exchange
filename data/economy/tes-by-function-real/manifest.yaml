transformations: Download PSS July 2026 Chapter 4. Read sheet 4_3 for curated rows.
  Keep financial years 2003-04 to 2025-26. Curate ten COFOG level-1 functions, EU
  transactions, published TES, accounting adjustments, and table TME. All rows are
  classification=total because the sheet does not split current and capital. Skip
  of-which lines. Do not invent a residual for the £ billion rounding gap. Read sheet
  4_2 only to prove Health 2024-25 is 242.4 nominal and that 2025-26 real equals nominal.
  2025-26 observation_status=estimated. Notes use series, classification, role, fy,
  cofog, label, table=4.3, price_base=2025-26, terms=real. Table TME notes set denominator=hmt-table-tme.
revision_notes: PSS July 2026, file updated 2026-07-29. 2025-26 is the first outturn
  estimate. Later PSS editions can revise these years. Compare sha256 before replacing
  the raw workbook. Real-terms figures are the nominal figures adjusted to 2025-26
  price levels using GDP deflators from the Office for National Statistics (released
  30 June 2026).
caveats: Unit is £ billion at 2025-26 prices, one decimal place. Do not mix these
  rows with £ million Table 5.4 or Table 1.2. Real-terms figures are the nominal figures
  adjusted to 2025-26 price levels using GDP deflators from the Office for National
  Statistics (released 30 June 2026). PESA plan years are not in these pins. Where
  PESA prints plan years, it also uses OBR GDP deflator forecasts from the 3 March
  2026 Economic and fiscal outlook. That forecast deflator is not applied here. In
  2024-25, Health is 250.8 (real) against Table 4.2 Health 242.4 (nominal). TES is
  1,206.6 and accounting adjustments are 127.8; their sum is 0.1 below published table
  TME 1,334.5. That rounding is stored as printed. No residual function. EU transactions
  in 2024-25 are -1.5, so the ten functions are not TES on their own. Defence is the
  UN COFOG definition, not the NATO definition. Public-sector debt interest is an
  of-which line inside General public services and is not a separate curated function.
  No Tax−Spend=Borrow identity. No OSCAR rows. No PESA plan years. These rows are
  official HMT real-terms financial-year tables. They are not monthly EBFT divided
  by CPIH or by the GDP deflator. Do not treat real HMT table TME as a real monthly
  EBFT series.
status_note: Financial-year outturn for 2003-04 to 2025-26 from PSS July 2026 Table
  4.3, 2025-26 prices. 2025-26 is a first estimate and can still be revised. 2025-26
  real equals nominal Table 4.2.
