indicator_id: tes-by-function-real
title: Public sector expenditure on services by function in real terms (PSS Table
  4.3)
sector: economy-public-finance
publisher: HM Treasury
source_url: https://www.gov.uk/government/statistics/public-spending-statistics-release-july-2026
series_id: PSS July 2026 Table 4.3
geography: 'United Kingdom public sector (K02000001): central government, local government
  and public corporations, including devolved administrations inside the functions'
frequency: annual
unit: £ billion, 2025-26 prices, financial year
definition: HM Treasury Total Expenditure on Services (TES) by UN COFOG level 1, from
  PSS July 2026 Table 4.3. Financial-year outturn from 2003-04 to 2025-26, £ billion,
  one decimal place, 2025-26 prices. Each function is the published total (current
  and capital already summed). EU transactions keep the published sign and sit inside
  TES but outside the ten functions. The published TES total is stored because level-1
  leaves can miss it by up to £0.2 billion. Accounting adjustments are the bridge
  from TES to this table's Total Managed Expenditure. They are not a function. In
  2025-26 these rows equal nominal Table 4.2. Health in 2024-25 is 250.8, against
  Table 4.2 Health 242.4. Table 4.2 is not curated. Real-terms figures are the nominal
  figures adjusted to 2025-26 price levels using GDP deflators from the Office for
  National Statistics (released 30 June 2026). PESA plan years are not in these pins.
  Where PESA prints plan years, it also uses OBR GDP deflator forecasts from the 3
  March 2026 Economic and fiscal outlook. That forecast deflator is not applied here.
  This table's real TME is not monthly ONS EBFT.
