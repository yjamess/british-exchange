transformations: Download ONS timeseries JSON (ABMI/PN2 /data). Keep only the quarters
  array (annual aggregates omitted). Map year+Q→ISO calendar-quarter bounds. Geography
  fixed to K02000001 / United Kingdom. Values parsed as float £m; empty → missing.
  Latest quarter provisional; older quarters final (charts drop provisional).
revision_notes: 'ABMI levels are routinely revised: (1) each subsequent GDP monthly/quarterly
  release after the first estimate; (2) at each QNA release; (3) at Blue Book with
  supply-and-use balancing and CVM rebasing. Orchestrator source policy 2026-11-14:
  live pin is PN2 (first estimate) when it has the newer releaseDate — QNA 2026-09-29
  did not advance on 2026-11-12; PN2 did (2026 Q3). Prefer QNA again when its releaseDate
  is newer. The Aug-2026 PN2 (ref year 2023) vs Sep-2026 QNA (ref year 2024) level
  ratio was 1.027–1.045 — use growth rates or index to a fixed quarter when mixing
  vintages. Re-fetch and re-pin raw JSON; compare checksums. Record official_release_date
  from description.releaseDate.'
caveats: Legacy api.ons.gov.uk retired 2024-11-25; ingest uses website timeseries
  JSON. Historical levels revise each quarterly release and Blue Book. Annual rows
  present in raw JSON but not written to curated observations.
