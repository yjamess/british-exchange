transformations: Download ONS timeseries JSON (ABMI/QNA /data). Keep only the quarters
  array (annual aggregates omitted). Map year+Q→ISO calendar-quarter bounds. Geography
  fixed to K02000001 / United Kingdom. Values parsed as float £m; empty → missing.
  Latest quarter provisional; older quarters final (charts drop provisional).
revision_notes: 'ABMI levels are routinely revised: (1) each subsequent GDP monthly/quarterly
  release after the first estimate; (2) at each QNA release; (3) at Blue Book with
  supply-and-use balancing and CVM rebasing (annual rebasing: Blue Book 2025 moved
  the reference year 2022→2023; the QNA vintage of 2026-09-29 is on 2024 — confirm
  reference year on release notes each ingest). Source switched PN2→QNA on 2026-11-11
  (Orchestrator source policy): QNA/PN2 level ratio is 1.027–1.045 across all 286
  quarters while growth since 2019 Q4 differs by under 0.1 pp (PN2 +6.26%, QNA +6.21%)
  — use growth rates or index to a fixed quarter when mixing vintages. Do not treat
  a pinned historical point as immutable — re-fetch and re-pin raw JSON, then compare
  checksums. observation_status stays ''provisional'' to signal revision risk. Record
  official_release_date from description.releaseDate.'
caveats: Legacy api.ons.gov.uk retired 2024-11-25; ingest uses website timeseries
  JSON. Historical levels revise each quarterly release and Blue Book. Annual rows
  present in raw JSON but not written to curated observations.
