revision_notes: 'ABMI levels are routinely revised: (1) each subsequent GDP monthly/quarterly
  release after the first estimate; (2) when the series moves from PN2 first estimate
  into QNA; (3) at Blue Book with supply-and-use balancing and CVM rebasing (BB2024
  restored annual rebasing; last base year 2022 — confirm on release notes each ingest).
  Do not treat a pinned historical point as immutable — re-fetch and re-pin raw JSON,
  then compare checksums. observation_status stays ''provisional'' for this PN2-sourced
  slice to signal revision risk. Record official_release_date from description.releaseDate.'
caveats: Legacy api.ons.gov.uk retired 2024-11-25; ingest uses website timeseries
  JSON. Historical levels revise each quarterly release and Blue Book. Annual rows
  present in raw JSON but not written to curated observations.
