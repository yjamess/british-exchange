series_id: LFL8
geography: United Kingdom (K02000001); excl. Crown dependencies
frequency: monthly
unit: Thousands of people aged 16–64, SA
definition: 'UK economically inactive aged 16–64 whose main reason is being a discouraged
  worker (not looking because they believe no jobs are available), seasonally adjusted,
  thousands. ONS CDID LFL8. The LMS title is only ''Discouraged workers level people:
  000s''. Age, geography and seasonal adjustment are taken from INAC01 SA, where LFL8
  is the dataset identifier on the all-persons reason-levels column. Not LF77 (percent)
  and not LF8B (wants-a-job subset).'
