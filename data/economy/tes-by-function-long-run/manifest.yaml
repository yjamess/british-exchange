indicator_id: tes-by-function-long-run
title: Public sector expenditure on services by function, long run (PSS Table 4.2)
sector: economy-public-finance
publisher: HM Treasury
source_url: https://www.gov.uk/government/statistics/public-spending-statistics-release-july-2026
series_id: PSS July 2026 Table 4.2
geography: 'United Kingdom public sector (K02000001): central government, local government
  and public corporations, including devolved administrations inside the functions'
frequency: annual
unit: £ billion, nominal, financial year
definition: HM Treasury Total Expenditure on Services (TES) by UN COFOG level 1, from
  PSS July 2026 Table 4.2. Financial-year outturn from 2003-04 to 2025-26, £ billion,
  one decimal place, nominal. Each function is the published total (current and capital
  already summed). EU transactions keep the published sign and sit inside TES but
  outside the ten functions. The published TES total is stored because level-1 leaves
  can miss it by up to £0.2 billion. Accounting adjustments are the bridge from TES
  to this table's Total Managed Expenditure. They are not a function. This is the
  long-run companion of £ million Table 5.4 (tes-by-function) and of real £ billion
  Table 4.3 (tes-by-function-real). Do not mix the units. Health in 2024-25 is 242.4
  nominal, against Table 4.3 Health 250.8 in 2025-26 prices. Table 4.3 is not curated.
  This table's TME is not monthly ONS EBFT.
