transformations: Download PSS July 2026 Chapter 4. Read sheet 4_2 for curated rows.
  Keep financial years 2003-04 to 2025-26. Curate ten COFOG level-1 functions, EU
  transactions, published TES, accounting adjustments, and table TME. All rows are
  classification=total because the sheet does not split current and capital. Skip
  of-which lines. Do not invent a residual for the £ billion rounding gap. Read sheet
  4_3 only to prove Health 2024-25 is 250.8 there and 242.4 here, and that 2025-26
  nominal equals real. Do not write Table 4.3. Do not write £ million Table 5.4 into
  this folder. 2025-26 observation_status=estimated. Notes use series, classification,
  role, fy, cofog, label, table=4.2, terms=nominal. Table TME notes set denominator=hmt-table-tme.
revision_notes: PSS July 2026, file updated 2026-07-29. 2025-26 is the first outturn
  estimate. Later PSS editions can revise these years. Compare sha256 before replacing
  the raw workbook. Table 4.2 Health 2024-25 (242.4) is Table 5.4 Health 242,429 £
  million rounded to 0.1 billion. The £ million series stays in tes-by-function.
caveats: Unit is £ billion, nominal, one decimal place. Do not mix these rows with
  £ million tes-by-function or with £ billion tes-by-function-real (2025-26 prices).
  In 2024-25, Health is 242.4, Social protection is 386.3, TES is 1,166.5, accounting
  adjustments are 123.6, and table TME is 1,290.0. Level-1 leaves plus EU are 0.1
  above TES that year, and TES plus adjustments are 0.1 above table TME. The largest
  leaf gap in this workbook is £0.2 billion, in 2022-23. Published cells are stored.
  No residual function. EU transactions in 2024-25 are -1.4, so the ten functions
  are not TES on their own. Defence is the UN COFOG definition, not the NATO definition.
  Public-sector debt interest is an of-which line inside General public services and
  is not a separate curated function. No Tax−Spend=Borrow identity. No OSCAR rows.
  No PESA plan years. No ESA Table 11 rows. This table's TME is not monthly EBFT.
status_note: Financial-year outturn for 2003-04 to 2025-26 from PSS July 2026 Table
  4.2, nominal £ billion. 2025-26 is a first estimate and can still be revised. Not
  the real-terms Table 4.3 series.
