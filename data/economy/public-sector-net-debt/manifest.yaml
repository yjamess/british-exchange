revision_notes: Public Sector Finances (PUSF) monthly estimates revise as administrative
  data arrive and methods change. Re-fetch and re-pin raw JSON; compare checksums.
  Record official_release_date from description.releaseDate.
caveats: Legacy api.ons.gov.uk retired 2024-11-25; ingest uses website timeseries
  JSON. Headline fiscal measures often quoted as financial-year-to-date sums — this
  package stores period (month) levels only. Quarterly/annual aggregates exist in
  raw JSON but are not written to curated observations. Values are £ billion (not
  £ million). HF6X (% of GDP) is the companion ratio often quoted alongside HF6W.
