transformations: Download ETB FYE 2024 reference tables xlsx (https://www.ons.gov.uk/file?uri=/peoplepopulationandcommunity/personalandhouseholdfinances/incomeandwealth/datasets/theeffectsoftaxesandbenefitsonhouseholdincomefinancialyearending2014/financialyearending2024/etbreferencetablesfye202324final.xlsx).
  Parse Table 8 headline Direct/Indirect/All taxes rows under each published percentage
  section; parse Table 2a 'Total direct taxes' and 'Total indirect taxes' rows. Emit
  one observation per tax × band (× denominator for Table 8). Skip component tax rows
  (Income Tax, VAT, …). Do not invent direct-tax shares of disposable income or expenditure.
revision_notes: ETB revises prior years when processing errors are found (see dataset
  corrections). Re-pin the edition workbook; compare checksums. Sample sizes fell
  in FYE 2024 (HFS −21%).
caveats: HFS/LCF sample of private households only — excludes institutions and people
  experiencing homelessness. Indirect-tax / final-income path uses the smaller LCF
  expenditure sample. Quintile averages are not individual liabilities. Deferred lump-sum
  direct tax payments can distort bottom-quintile direct-tax estimates (ONS notes
  5–6). Expenditure denominator available from 1995/96 (note 13). Domain 04 owns household
  income/HBAI series — link, do not fork. Not comparable to AHHY public-sector tax
  receipts.
status_note: Ready after Validation PASS 2026-11-15 (30/0/0). Burden UI may use Table 8
  + Table 2a only — no invented denominators.
