title: Effects of taxes and benefits (direct/indirect tax burden)
sector: economy-public-finance
publisher: ONS
source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/incomeandwealth/datasets/theeffectsoftaxesandbenefitsonhouseholdincomefinancialyearending2014
series_id: ETB reference tables · Table 8 + Table 2a totals · FYE 2024
geography: United Kingdom (K02000001); private households (HFS/LCF)
frequency: annual (financial year)
unit: percent of denominator | £ per year (household average)
definition: ONS Effects of taxes and benefits on household income (ETB), financial
  year ending 2024. Curates (1) Table 8 — direct, indirect and all taxes as a percentage
  of gross income; indirect taxes also as a percentage of disposable income and of
  expenditure (only where ONS publishes those denominators); (2) Table 2a — average
  household £/year total direct and total indirect taxes by equivalised disposable-income
  quintile. Survey-derived group averages for private households — not what any specific
  household pays; legal liability ≠ economic incidence; no fairness claims. Ranking
  uses modified-OECD equivalised disposable income; Table 2a £ averages are unequivalised
  household means.
