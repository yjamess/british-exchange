unit: £ million, NSA
definition: Public sector total managed expenditure (TME), £ million current prices
  NSA. ONS CDID EBFT in PUSF — open monthly National Accounts aggregate matching the
  HMT/OBR TME concept (public-sector current expenditure plus public-sector gross
  investment). HMT presents TME as DEL + AME (plus accounting adjustments in PESA/PSS
  tables); this row is the ONS monthly TME level, not a departmental outturn table.
