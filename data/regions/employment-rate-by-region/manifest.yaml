transformations: Read HI00 Index for GSS code, label, and persons sheet. On each sheet,
  find the age-group header, then take only the employment-rate column inside the
  16-64 block. Ignore men and women sheets. Do not read Claimant Count. Keep workbook
  precision. Mark only the latest rolling quarter provisional.
revision_notes: Pinned regionaltable1s.xlsx on 2026-11-15. sha256 ff374cf96c5fa18a60f4540318b03a24fc06e9b0cd6af502c9dd205dcdc4967d.
  Same file as the 2026-11-03 pin (official release 2026-10-20). Employment parsing
  now uses the 16-to-64 block. The previous parser took the first Employment rate
  (%) column, which is aged 16 and over. Not Ready until Validation.
caveats: Same age and denominator idea as Economy employment-rate (LF24), but geography
  is a nation or English region, not the UK. The workbook also contains an employment
  rate for everyone aged 16 and over; that column is not this indicator. LFS sample
  sizes are smaller for regions than for the UK, so short-term moves are noisy. Persons
  sheets only (men and women are in the workbook and are not ingested). Seasonally
  adjusted rolling three-month periods, published monthly. HI00 has no UK or Great
  Britain sheet — do not invent those rows by adding regions. Claimant Count is not
  in this workbook and is not ILO unemployment. These rates are resident LFS people,
  not BRES employee jobs. Next HI00 release 17 November 2026.
status_note: Pinned to the 20 October 2026 HI00 release. The next regional labour
  market release is 17 November 2026.
