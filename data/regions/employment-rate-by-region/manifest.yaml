open_questions:
- UK and Great Britain headline rates are in the regional bulletin table but not in
  HI00. Left to Economy national series; do not sum regions.
- HI00 column 17 is a 16-to-64 ILO unemployment rate (closer to Economy LF2Q on age)
  but it is not the published regional headline, so it is not ingested.
- Level cells are people (they reproduce the rates). A corner label says thousands.
  Levels are not ingested until that label is reconciled.
- Workbook footnotes shade some estimates as small samples. That flag is not copied
  onto rows.
- Local authority Annual Population Survey geography is out of scope for this pin.
