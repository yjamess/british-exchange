revision_notes: Pinned 21 October 2026 PIPR monthly edition (shared raw with private-rental-price-index).
caveats:  Scotland rents are
  mainly advertised new lets; Northern Ireland advertised new lets only and lag other
  UK nations — compare with care. Northern Ireland missing for the latest two UK months
  (ONS imputes NI into the UK total). Local figures can jump month-to-month.
