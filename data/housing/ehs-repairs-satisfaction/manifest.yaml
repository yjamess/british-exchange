caveats: 'Self-reported satisfaction (survey-response). Different bases are never
  mixed in one series key: FT5421 (breakdown=none) is all renting households, full
  household sample, and its total includes a few households where no repairs were
  done or repairs were not the landlord''s responsibility; PIQ AT3.1/3.2 (breakdown=housing-quality
  / repair-responsibility, category …:all-households / all-private-renters for their
  own totals) exclude households whose landlord / freeholder / agent is not responsible
  and use the household subsample — so 2024-25 private renters ''satisfied'' is 72.6%
  in FT5421 but 67.5% in AT3.1. PIQ adds owner-occupier leaseholders (freeholder/agent
  repairs). 1994-95 to 2007-08 Survey of English Housing (1994-95 asked October–March
  only); 2008-09 onwards EHS, with LSVT/ALMO transfers between LA and HA accounted
  for from 2008-09 (table note 3). FT5421 private renters print an unlabelled values
  row between 2007-08 and 2008-09 — not ingested (QA). Reasons are a single main reason
  among dissatisfied households.'
