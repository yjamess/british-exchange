series_id: LT 691b; Right to Buy sales open data; Right to Buy replacements open data
geography: England (E92000001) and English regions (RGN25CD) — not UK
frequency: annual
unit: dwellings
definition: 'Right to Buy sales of local authority homes in England, and the replacement
  homes funded from Right to Buy receipts. series=all-right-to-buy-sales is every
  Right to Buy sale of council stock since 1980-81 (LT 691b). series=eligible-sales
  counts sales eligible for receipts pooling since 2006-07, split by sale type in
  category. series=replacements is new-build starts plus acquisitions funded from
  receipts (the publisher''s replacement measure); the replacement-* series give starts,
  acquisitions, unsplit starts-or-acquisitions and new-build completions. category
  on replacement series names the provider: local-authorities, homes-england-gla or
  all.'
