transformations: LT_691b_R parsed as published (regions + England). Sales and replacements
  open data summed from local authority rows to RGN25CD region and England. Replacements
  = rows with Replacement_Type_1 'Starts and Acquisitions'. LT_693.ods is pinned for
  QA only.
revision_notes: Pinned 2025-26 release files (published 6 August 2026), retrieved
  2026-11-10.
caveats: England only. Eligible sales exclude sales outside a Housing Revenue Account
  and include some shared ownership and other discounted sales; they are not all Right
  to Buy sales. Shared ownership sales count as part-dwellings, so values can have
  decimals. Open data reconciles some differences and may not match LT 691a exactly.
  LT 691b ends at 2024-25. Homes England has not separately recorded receipt-funded
  starts since 2023-24, so replacements from 2023-24 may be undercounted. Replacements
  are funded over up to five years (three before April 2021) and do not match sales
  in the same year. Unsplit starts-or-acquisitions are reported before 2017-18.
