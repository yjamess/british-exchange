transformations: One pinned workbook per annual edition (12 editions). From sheet
  12.4a / 12.3a read the 'Total' column for UK residential buildings, total gross
  capital value and total net capital value (number and £ million). The death-year
  in each title is checked against the edition. Earlier editions come from UK Government
  Web Archive captures because their GOV.UK asset URLs now redirect to the current
  file. No values are derived or summed.
revision_notes: Ownership phase 5 ingest 2026-11-10. Each tax year comes from its
  own first-published edition; HMRC does not republish earlier years.
caveats: 'Aggregate only: national totals for all estates in a year, not the inheritance
  of individual homes and not a property chain. Year basis is the tax year of death,
  not the year the property passed or was sold. Coverage changes (category dimension):
  to 2020-21 the population includes excepted, non-taxpaying estates that filed reduced
  returns (about 270,000 to 310,000 estates); from 1 January 2022 excepted estates
  no longer report assets, so 2022-23 onward covers only estates filing a full IHT400
  account (about 69,000); 2021-22 is a part-year mix. Do not read the drop after 2021-22
  as a fall in property passing on death. These are not taxpaying estates only: most
  estates in the table pay no tax. Estates passing without a grant of representation
  or return are not covered. Values are probate valuations before reliefs and exemptions;
  residential value is gross of mortgages. Counts in older editions are sample-weighted,
  and later editions round to three significant figures. Figures may be under-estimates
  where returns were not yet recorded when HMRC extracted the data.'
