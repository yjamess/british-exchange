indicator_id: estates-residential-property
title: UK residential property in estates passing on death
sector: housing-land
publisher: HM Revenue & Customs
source_url: https://www.gov.uk/government/statistics/inheritance-tax-liabilities-statistics
series_id: 'Inheritance Tax liabilities statistics Table 12.3a (from July 2023; Table
  12.4a in Inheritance Tax statistics to July 2022): assets in estates by range of
  net estate, Total column'
geography: United Kingdom (K02000001)
frequency: annual
unit: gbp-millions (value series) or estates (count series)
definition: 'For estates of people who died in each UK tax year (6 April to 5 April)
  and were notified to HMRC on Inheritance Tax returns: residential-value is the total
  value of UK residential buildings held in those estates, before reliefs and exemptions
  and before deducting mortgages; residential-estates is the number of those estates
  holding any UK residential buildings. gross-capital-* and net-capital-* are total
  gross assets and net estate (assets less liabilities) for the same estates, so a
  residential share can be derived. These are estates notified for probate that filed
  a return (taxpaying and non-taxpaying), not taxpaying estates only.'
