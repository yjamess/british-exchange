transformations: Parse Figure_7 of the 2024-25 graph tables. Year label is the financial-year
  end (2013 = 2012-13). replacement-ratio is derived here from two published columns;
  every other value is copied as published.
revision_notes: Pinned Graph_Tables.ods from the 21 August 2025 release, retrieved
  2026-11-10.
caveats: England only, national target (not per council). The series ends at 2024-25
  because MHCLG stopped reporting the target from the 2025-26 release; it is not extended
  here. Homes England has not separately recorded receipt-funded starts since 2023-24,
  so replacements from 2023-24 may be undercounted. The replacement window was three
  years for the target as published, although councils have had five years to spend
  receipts since April 2021. replacement-ratio is derived and is context for the pledge,
  not evidence of what caused the gap.
