indicator_id: right-to-buy-one-for-one
title: Right to Buy one-for-one replacement
sector: housing-land
publisher: MHCLG
source_url: https://www.gov.uk/government/statistics/right-to-buy-sales-and-replacements-england-2024-to-2025
series_id: Right to Buy sales and replacements 2024-25, Figure 7 (one-for-one replacement
  target)
geography: England (E92000001) — not UK
frequency: annual
unit: 'dwellings (replacement-ratio: replacements per additional sale)'
definition: The national one-for-one replacement measure as published by MHCLG. Additional
  sales are Right to Buy sales above a pre-2012 baseline forecast. The replacement
  target in a year is the cumulative additional sales up to three years earlier. Cumulative
  replacements are receipt-funded new-build starts plus acquisitions since April 2012.
  series=replacement-ratio is cumulative replacements divided by the target (1 means
  the target is met).
