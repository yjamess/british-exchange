transformations: 'Header-driven parse of every year sheet (housing.connectors.ehs_da_parse):
  measure columns located by header text; legacy (tenure rows) and modern (tenure
  column blocks) layouts; rows kept for tenure, dwelling age, dwelling type, floor
  area, region / sub-national area and the all-dwellings summary. Published cells
  only — ''u'' → suppressed, N/A → missing. Supplementary published tables fill only
  keys the live tables do not publish (DT3101; 2024-25 annex AT1.6, AT1.8, AT1.9,
  AT1.10). Series values: any-damp, rising-damp, penetrating-damp, condensation-mould,
  multiple-damp-problems. Headline: series=any-damp; breakdown=none.'
revision_notes: '2026-11-04 v2: adds dwelling-age / dwelling-type / floor-area / region
  breakdowns, criterion / hazard / damp-type series and 2008–2021 history (v1 had
  2022–2024 headline only). Energy bands: v1 mis-read 2008–2011 columns (band D shown
  as A/B/C) — fixed by header-driven parsing; all-social relabelled social-rented
  (tenure-label note keeps the published label).'
caveats: 'England survey estimates from the EHS physical (dwelling) survey — not UK,
  not an administrative count, not an assessment of any individual home. Each dwelling
  year pools two fieldwork years (e.g. 2024 = April 2023–March 2025). Breakdowns are
  exactly those published: 2008–2021 characteristic rows (dwelling age / type / floor
  area / area) are all-tenures only; from 2022 the condition tables cross each characteristic
  with owner occupied / private rented / social rented, but the tenure-specific cells
  share one row-level sample size (sample-scope=row-all-tenures). Region (9 ONS regions,
  E12…) is published from 2020; 2008–2019 only three sub-national areas (Northern;
  London and South East; Rest of England) with no ONS code. No dwelling type × region,
  age × region or region × tenure-by-characteristic cross is published. ''u'' = unweighted
  cell count 1–4 (suppressed, no value). 2020 and 2021 are occupied dwellings only
  and were modelled differently (no full internal inspection, COVID-19); several criteria
  are N/A (missing) in 2020–2022. 2022 combines 2021-22 ''external plus'' and 2022-23
  full surveys (hybrid; compare with caution). Floor-area bands 2020–2022 use modelled
  internal dimensions. Damp types are not mutually exclusive (a dwelling can be counted
  in more than one). Type split not collected 2020–2022 (N/A). 1996–2007 come from
  the English House Condition Survey via annex AT1.9 (all tenures only).'
