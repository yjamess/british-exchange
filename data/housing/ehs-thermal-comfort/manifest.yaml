transformations: 'Annex sheets split into thousands / percentages / sample sections
  (housing.connectors.ehs_lived_experience.read_blocks); tenure columns checked against
  header text; one row per published percentage cell with published thousands and
  unweighted sample sizes in notes; ''u'' → suppressed. Complements (able to keep
  warm, home not hot, suitable accommodation, all adaptations installed) not emitted.
  Sources: https://www.gov.uk/government/statistics/english-housing-survey-2024-to-2025-perceptions-and-impacts-of-housing-quality
  ; https://www.gov.uk/government/statistics/english-housing-survey-2024-to-2025-weather-resilience-in-housing-fact-sheet'
revision_notes: '2026-11-04: initial ingest (Domain 07 housing quality wave 2).'
caveats: 'Subjective self-report by the household reference person or main respondent
  — perception, not a measured temperature or a surveyor assessment (cf. ehs-category-1-hazards
  excess cold, a modelled HHSRS hazard). Two bases: PIQ tables are ''all households''
  (household subsample, non-response excluded); weather fact-sheet tables are ''all
  occupied dwellings'' (same respondents weighted to dwellings, don''t-know excluded)
  — the all-dwellings rows of AT1.1/1.2 equal PIQ AT2.9 and are not duplicated (QA
  compares). Single snapshot (2024 / 2024-25): the fact sheet cites 7% overheating
  in 2019 from the 2019-20 headline report, not ingested. Weather tables cross dwelling
  type and construction type with three tenures only (no LA/HA split). Figures based
  on small samples are italicised in the source (not machine-readable); cell-sample-unweighted
  is carried instead — treat bases under ~100 as indicative. ''u'' = unweighted count
  1–4. The published AT1.2 thousands for detached houses, all dwellings (4,190) is
  inconsistent with its 5.7% share (QA §); percentages are unaffected.'
