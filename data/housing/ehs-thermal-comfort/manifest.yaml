definition: 'Household-reported thermal comfort in England, 2024 dwelling sample (2024-25
  household subsample): unable to keep comfortably warm in the living room in cold
  winter weather (unable-to-keep-warm-in-winter); home gets uncomfortably hot and
  cannot be cooled (home-gets-uncomfortably-hot); overheating only / unable to keep
  warm only / both / neither; rooms affected by overheating; and the energy actions
  reduced-heating and limited-energy-use taken in response to rising energy prices.
  By tenure, dwelling type, construction (wall) type and household age composition.'
