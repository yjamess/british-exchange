source_url: https://www.gov.uk/government/statistical-data-sets/dwelling-condition-and-safety
series_id: DA5201 / DA5202 Disrepair and electrics
geography: England (E92000001); ONS regions E12000001–E12000009 from 2020; EHS sub-national
  areas 2008–2019 — dwelling sample survey estimates
frequency: annual
unit: percent of dwellings
definition: 'Share of England dwellings by standardised basic repair cost band — the
  modelled cost (£ per m² of floor area, current prices) of the basic repairs the
  EHS surveyor records as needed: zero costs (no basic repairs needed), £1–20, £20–35,
  £35–65, over £65 per m². Plus the share with all five electrical safety features
  (all PVC wiring, modern earthing, modern consumer unit, MCBs, RCDs). English Housing
  Survey dwelling sample.'
