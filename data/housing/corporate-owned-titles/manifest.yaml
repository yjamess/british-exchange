transformations: Stream each full-file CSV, skip the 'Row Count:' trailer and check
  it equals the rows read. Count titles by origin (CCOD = UK company, OCOD = overseas
  company), tenure, district, first proprietor's category and, for OCOD, first proprietor's
  country. Districts map to ONS LAD December 2024 codes by name, with four aliases.
  Distinct UK companies = distinct registration numbers across proprietors 1–4. Each
  run appends its month.
revision_notes: Domain 09 ingest 2026-11-10, release 2026-11.
caveats: Raw zips are not retained (CCOD is 1.59 GB unzipped); the manifest keeps
  their checksums. HM Land Registry's API serves only the current month, so a past
  month cannot be re-fetched. Titles held by individuals are not in these files. Counts
  are titles, not properties or land area. A title with a UK and an overseas company
  proprietor can appear in both files.
