transformations: Parse Table_2_-_Monthly. Month rows are checked against each published
  year row and the cumulative total for completions. category=all sums the two schemes
  by month. Parse Release_Table_2 for England first-time-buyer quarterly rows; quarters
  are checked against each published year total and the cumulative total.
revision_notes: Pinned Help_to_Buy_Tables.ods from the final release (16 November
  2023), retrieved 2026-11-10. Release Table 2 (FTB quarterly) added 2026-11-10.
caveats: England only. Legacy FirstBuy completions after 1 April 2013 are excluded.
  The two schemes overlapped in April and May 2021. Completions count purchases, not
  new homes built, and are not additional supply. Values are revised figures from
  the final release. category=first-time-buyer is quarterly only and must not be added
  to the monthly scheme rows (those already include first-time buyers).
