indicator_id: help-to-buy-equity-loan
title: Help to Buy equity loan completions
sector: housing-land
publisher: MHCLG
source_url: https://www.gov.uk/government/statistics/help-to-buy-equity-loan-scheme-data-to-31-may-2023
series_id: 'Help to Buy: Equity Loan Table 2 (monthly) and Release Table 2 (quarterly
  first-time buyers), England'
geography: England (E92000001) — not UK
frequency: monthly (all schemes); quarterly (first-time buyers)
unit: 'legal completions (equity-loan-value and property-value: GBP million)'
definition: Purchases of new-build homes in England completed with a Help to Buy equity
  loan. Monthly rows (Table 2) cover April 2013 to May 2023 by scheme. Quarterly rows
  (Release Table 2) are first-time-buyer completions and values for England. series=completions
  counts legal completions (one per purchase); equity-loan-value is the government
  loan at completion and property-value the total purchase price, both in £ million.
  category gives the 2013-2021 scheme, the 2021-2023 scheme, all, or first-time-buyer.
licence: Open Government Licence v3.0
agent_owner: housing
