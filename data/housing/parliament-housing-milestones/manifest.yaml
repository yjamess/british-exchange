transformations: Parse the HTML tables from the GOV.UK Content API body. Column labels
  map to dates explicitly (unknown labels fail). Values copied as published; nothing
  is apportioned here.
revision_notes: Pinned Content API JSON of both pages, retrieved 2026-11-10.
caveats: Periods after the latest annual net additions release are EPC-based estimates
  (new-build EPC lodgements less a demolitions allowance), rounded by the publisher
  and replaced by outturn later; they are marked estimated. Part years at the start
  of a Parliament are split by the publisher using weekly EPC lodgements. The 2024-25
  column of the 2024 table is the whole financial year, including weeks before 9 July
  2024. The 2019 table is a departmental note (May 2024), not an official statistic,
  and was not updated after the Parliament ended. Rounded period values may not sum
  to the total.
