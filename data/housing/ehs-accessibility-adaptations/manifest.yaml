indicator_id: ehs-accessibility-adaptations
title: EHS accessibility features and home adaptations
sector: housing-land
publisher: MHCLG · English Housing Survey
source_url: https://www.gov.uk/government/statistics/english-housing-survey-2019-to-2020-home-adaptations
series_id: EHS 2018 accessibility annex AT1/AT2 + 2019-20 home adaptations annex AT1.1
  / AT1.3 / AT3.1
geography: England (E92000001) — survey estimates / household responses
frequency: ad_hoc
unit: percent of dwellings / households (see base=)
definition: 'Accessibility: share of England dwellings with each of the four ''visitability''
  features recorded by the EHS surveyor — level access to the main entrance, flush
  threshold (<15mm), WC at entrance level, doorsets and circulation meeting Part M
  — and all four, by tenure, 2009 and 2018 (survey-estimate). Adaptations: share of
  households with someone whose long-standing illness or disability requires adaptations
  (2014-15, 2019-20), and among those households the share whose home is unsuitable
  and the share lacking an adaptation they need, by tenure and age of the oldest person
  needing adaptations (survey-response).'
