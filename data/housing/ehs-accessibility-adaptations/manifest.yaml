transformations: 'Annex sheets split into thousands / percentages / sample sections
  (housing.connectors.ehs_lived_experience.read_blocks); tenure columns checked against
  header text; one row per published percentage cell with published thousands and
  unweighted sample sizes in notes; ''u'' → suppressed. Complements (able to keep
  warm, home not hot, suitable accommodation, all adaptations installed) not emitted.
  Sources: https://www.gov.uk/government/statistics/english-housing-survey-2018-accessibility-of-english-homes-fact-sheet
  ; https://www.gov.uk/government/statistics/english-housing-survey-2019-to-2020-home-adaptations'
revision_notes: '2026-11-04: initial ingest (Domain 07 housing quality wave 2).'
caveats: 'Old snapshots: accessibility features 2009 and 2018 (dwelling years; fact
  sheet published 2020), adaptations 2014-15 and 2019-20 (report published 2021).
  No later EHS accessibility or adaptations tables are published. Accessibility cells
  are stored unrounded in the source workbook and rounded here to 1 dp (as displayed).
  Level access is assessed for fewer dwellings (base in notes). Adaptation needs are
  self-reported and include adaptations already installed; ''unsuitable'' and ''lacks''
  are among households needing adaptations only. 2019-20 fieldwork ended early (COVID-19,
  March 2020).'
