transformations: Current LPAs from organisation.csv (local-planning-authority set,
  no end-date). Plans credited to every member in `organisations` (joint plans). Ended
  plan records dropped. Adopted = stage adopted, or blank stage with an adoption date;
  date = adopted-date, else start-date. Most advanced preparation stage kept.
revision_notes: Initial Domain 06 ingest 2026-11-10 (T17) from the gap hunt.
caveats: 'Plan status, not site allocations. Planning Data is compiled from councils
  and is incomplete: 403 of 987 records have no stage and are not counted as adopted
  unless they carry an adoption date. For most adopted plans the adoption date is
  taken from start-date because adopted-date is blank. Required housing is the plan''s
  own figure over its plan period — not a target for one year, and not comparable
  across councils with different periods. Joint plans'' housing figures cover all
  member councils and are not attributed to any one council. Some councils with an
  adopted plan are missing from Planning Data (e.g. North Hertfordshire).'
