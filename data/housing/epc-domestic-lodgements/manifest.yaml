frequency: quarterly
unit: certificates lodged
definition: Number of domestic Energy Performance Certificates lodged on the England
  and Wales register in each calendar quarter (Q4 2008 onwards; calendar-year totals
  as published for the country sheets), by energy efficiency rating band A–G and 'not
  recorded' (series=band-a … band-g, band-not-recorded) and in total (series=lodgements-total).
  breakdown=none is all dwellings (D1); breakdown=dwelling-status splits existing
  (EB1) and new (NB1) dwellings.
