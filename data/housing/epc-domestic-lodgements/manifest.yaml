series_id: EPB live tables D1 (all dwellings), EB1 (existing), NB1 (new) — energy
  efficiency rating
geography: England and Wales (K04000001), England (E92000001), Wales (W92000004),
  English regions (E12000001–E12000009), plus 'Unknown' unallocated lodgements (EPC-UNALLOCATED,
