transformations: Read the country (England and Wales / England / Wales), region and
  (D1 only) local-authority sheets of D1, EB1 and NB1; one row per published count
  cell (lodgements total + 8 band columns). Quarter 'YYYY/q' → calendar quarter period;
  year rows → calendar year. Cumulative '(Total)' rows and region rows with no quarter
  are not ingested (QA reconciles them). Region names → ONS E12 codes; LA codes kept
  as published; 'Unknown' → EPC-UNALLOCATED. Total floor area (m²) not ingested. No
  values summed, shared out or modelled.
revision_notes: '2026-11-04: initial ingest from the 29 October 2026 live tables (data
  to 30 September 2026). Earlier releases are superseded, not archived here.'
caveats: 'Administrative record of certificates lodged in the period — NOT the dwelling
  stock and NOT a survey: buildings need an EPC only when sold, let or constructed
  (plus some scheme assessments), so dwellings not transacted since 2008 are absent
  and frequently-let homes recur. One property can have several certificates (repeat
  or superseded lodgements, e.g. a re-assessment after improvement); counts are certificates,
  not distinct homes. Selected population — compare with EHS energy efficiency bands
  (survey estimate of all England dwellings) rather than treating band shares as stock
  shares. Bands follow the SAP methodology in force at lodgement (RdSAP for existing
  dwellings); the rating ignores energy prices. LA codes are as published by the register
  (codes of the authority at lodgement: reorganised areas start or stop mid-series,
  e.g. North/West Northamptonshire from 2021 Q2, Cumberland / Westmorland and Furness,
  North Yorkshire and Somerset from 2023 Q2). The 29 Oct 2026 tables were aligned
  to the address-level open data and region/LA allocation methodology was updated,
  so figures for all quarters are lower than in earlier releases (publisher cover
  sheet). Quarters are revised each release. Publisher notes: note 1: On the 20 September
  2021 the register transitioned to www.gov.uk, prior to this data were provided by
  a contractor (Landmark) | note 2: The methodology used to assess energy efficiency
  does not take into account change in energy prices | note 3: The EPC register does
  not hold data for every domestic and non-domestic building or every building occupied
  by public authorities in England and Wales. Buildings only require an EPC when,
  sold, let or constructed. These statistics should, therefore, not be interpreted
  as a true representation of the whole of the building stock in England and Wales,
  but viewed as part of a wider package of Government’s provision of information on
  the energy efficiency of buildings. | note 5: New Dwellings’ include conversions
  and change of use and require an EPC once construction has been completed.'
