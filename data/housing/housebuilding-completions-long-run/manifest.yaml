transformations: 'LT_244: completion columns only (starts not emitted; starts are
  blank before the 1960s in the source). LT241: columns D–G; ''..'' (1946–1948) not
  emitted. series=private-enterprise|housing-association|local-authority|all-completions.
  Status: ''[p]'' / ''P'' → provisional, else final (''[r]''/''R'' revised but final).'
revision_notes: 'Pinned 2026-11-05: LiveTable244.ods published 24 September 2026 (2026
  Q2 release; 2023–2025 revised, 2025 provisional); Discontinued-LiveTable241.xlsx
  last updated 4 July 2019 (2018 provisional, never finalised in this table).'
caveats: New-build completions only — not net additional dwellings (no conversions,
  change of use or demolitions). Source notes say earlier years are less reliable
  and definitions may not be consistent across the series. England Oct 2005–Mar 2007
  omits a small number of approved-inspector completions. UK series is GB building-control
  data plus Northern Ireland data that used different definitions before 2005, and
  stops at 2018. Tenures may not sum to the total because of rounding to the nearest
  10. Do not splice England and UK; they are different geographies. Live Table 244
  annual totals equal the sum of Live Table 213 quarters from 1978 (see data/qa).
