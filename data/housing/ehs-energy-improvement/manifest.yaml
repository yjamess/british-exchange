revision_notes: 'Domain 07 Energy Anatomy ingest 2026-11-04. Same-day fix after QA
  (data/qa/qa_housing_ehs_inside_home_2026_11_04.md §6): columns located by header
  text per year. Wave 2 (2026-11-04, data/qa/qa_housing_quality_wave2_2026_11_04.md):
  heating / insulation now carry dwelling-age, dwelling-type, floor-area and region
  / sub-national-area breakdowns (DA6101/DA6102, DA6201/DA6202) and the published
  component series; every row gains breakdown=none|…; tenure ''all social'' relabelled
  social-rented (tenure-label note keeps the published label) to match the other EHS
  packages; evidence now pinned via housing.connectors.ehs_pins (stable retrieval
  timestamps). ehs-energy-improvement rows relabelled observation-type=modelled-derived.'
caveats: 'England survey estimates only — not UK and not EPC register certificates
  (see epc-domestic-lodgements for the administrative register). Breakdowns are exactly
  those published: characteristic rows (dwelling age / type / floor area / area) are
  all tenures only in every year; region (9 ONS regions) from 2020, three sub-national
  areas 2008–2019 (no ONS code). 2020 and 2021 are occupied dwellings only and modelled
  (COVID-19); 2022 is a hybrid sample. Column sets change: 2023 adds biomass / communal
  heating / heat pumps and drops water heating; solid fuel excludes biomass from 2023
  (not ingested); cavity-wall evidence wording and the assumed-insulated rule change
  (post-1990 no-CWI-evidence 2010–14; post-1995 assumed-as-built 2015+); loft depth
  bands change (200mm+ 2008–09; 150mm+ 2010+). Shares are of all dwellings in the
  group (no-loft dwellings included in the loft denominator) — unlike annex loft-200mm-plus.
  Improvement costs are SAP-modelled for dwellings below band C that can reach C.'
