transformation: Filter HPI calendar months from January 1995; retain supported exact
  area codes; preserve source numbers; pad missing calendar slots with null. Export
  existing topic rows and complete 31 March tenure snapshots without source duplication.
caveats:
- Experimental view export; independent validation and registry/publication review
  are required before publication.
- Prices are nominal UK HPI mix-adjusted area estimates, not individual property valuations
  or asking prices.
- Geography codes are retained exactly as supplied in this release. Boundary versions
  must be matched by code; no name-based or approximate joins are permitted.
- Source series have different start and end dates. Null means no source value; it
  is never zero and is not interpolated or carried forward.
- 'Monthly rows for Northern Ireland do not imply independent monthly observations:
  Northern Ireland contributes quarterly data in the UK HPI.'
- Recent UK HPI estimates are provisional and can revise. The compact export does
  not assign final status to individual observations.
- County, metropolitan-county, Inner/Outer London, Great Britain and England/Wales
  aggregates are excluded to avoid mixing overlapping areas into the local-authority
  layer.
- Sales volume counts transactions and has a different unit from prices. New-build,
  existing-home and sales-volume data can lag the latest average-price month.
- Annual price change must compare the same measure and geography exactly 12 calendar
  months apart; no comparison is available if either value is null.
- Tenure social category combines local-authority, private-registered-provider and
  other-public-sector dwellings; this is dwelling stock, not households.
- All five tenure components and all-dwellings total must be observed at 31 March.
  Component shares use the sum of components; source total can differ through rounding.
- Completions are England new-build completions, not net additions; affordability
  is England workplace-based price-to-earnings, not mortgage affordability; rent is
  a UK index, not rent in pounds.
- Archived LT213 Notes marks 2026 Q2 provisional, and LT104 Notes marks 2022–2025
  provisional (2024 also revised); existing canonical CSV statuses omit these flags.
  This experimental bundle recovers them without altering canonical CSVs. Completion
  [r]-only rows are revised; tenure status is provisional/final, with sourceFlags
  retaining revision notes.
registry_note: This experimental view reuses source indicators; it is deliberately
  excluded from the canonical Ready CSV catalogue. Register derived indicators and
  geographic layers separately before publication.
