transformations: 'Homes England: full financial-year blocks of Table 1, Total Affordable
  starts and completions for the two programmes. GLA: full financial-year blocks of
  Table 1, summing every line under ''AH: 2021-26 programme''; the partial current
  year is skipped. ahp-2021-26 = Homes England + GLA by year. Annual report: tables
  and the England starts sentence parsed from the GOV.UK Content API body; London
  + Homes England must equal England, and regions must sum to the Homes England totals.'
revision_notes: Pinned Homes England June 2026 tables and GLA Q1 2026-27 general programmes
  file, retrieved 2026-11-10.
caveats: 'Programme homes only: this is a subset of all affordable housing supply
  and differs from Live Table 1000. The GLA reports no 2021 to 2026 programme lines
  before 2023-24, so earlier England totals are Homes England only. Homes England
  starts to March 2025 are 942 below the MHCLG annual report (76,265 vs 77,207); completions
  match it exactly. London''s 2016 to 2023 programme is not included because the GLA
  lines cannot be mapped to the programme total. Starts and completions are different
  milestones: completions continue after the start deadline (March 2026, with limited
  exceptions) to March 2029 outside London.'
