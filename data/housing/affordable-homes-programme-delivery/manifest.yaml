frequency: annual
unit: dwellings (affordable homes)
definition: Affordable homes started on site and completed each financial year with
  funding from the Affordable Homes Programme. category=ahp-2021-26 adds Homes England
  (outside London) and the GLA (London) for the 2021 to 2026 programme; the agency
  categories give each part. category=soahp-2016-21-homes-england is Homes England's
  part of the 2016 to 2023 programme (named Shared Ownership and Affordable Homes
  Programme 2016-21), outside London only. series=cumulative-starts|cumulative-completions
  are the programme totals to 31 March 2025 from the MHCLG annual report (England,
  London, and Homes England regions), for category=ahp-2016-23 and ahp-2021-26.
