transformations: Read Table 3.8 percentile rows, Table 3.9 aggregate net property
  wealth, and the April 2020 to March 2022 block of Table 3.19. Survey-round headers
  map to the round's start and end dates.
revision_notes: Domain 09 ingest 2026-11-05. Edition released 24 January 2025.
caveats: Accreditation of the Wealth and Assets Survey was suspended from the April
  2020 to March 2022 round (ONS, 13 June 2025). Values are self-reported, Great Britain,
  and not Land Registry prices. The lower quartile for all households is £0 because
  households without property are included. Do not read the age table as personal
  wealth, and do not treat the aggregate as inheritance.
