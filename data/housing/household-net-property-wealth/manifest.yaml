indicator_id: household-net-property-wealth
title: Household net property wealth
sector: housing-land
publisher: Office for National Statistics
source_url: https://www.ons.gov.uk/peoplepopulationandcommunity/personalandhouseholdfinances/incomeandwealth/datasets/propertywealthwealthingreatbritain
series_id: Wealth and Assets Survey Tables 3.8, 3.9 and 3.19
geography: Great Britain
frequency: ad_hoc
unit: £, £ billion, or percent of people
definition: Net property wealth is self-valued property minus mortgage debt. Percentiles
  are for households. The age table is the share of people living in households in
  each band, including people who do not themselves own the home.
