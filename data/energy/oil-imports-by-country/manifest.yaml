revision_notes: DUKES_3.7.xlsx published 30 July 2026; annual sheets 2012–2025.
caveats: Geography is UK Official Statistics import totals by declared country of
  origin — not a pipeline entry-point atlas. Product-level columns (Crude oil, DERV,
  …) are out of scope for this indicator (open question). Country list widened from
  2018 (Note 2). Total imports by product may differ from other DUKES tables (Note
  3). Distinct from energy-imports-and-exports (ET 1.3 all-fuels ktoe) and energy-import-dependency.
  OGL v3.0.
