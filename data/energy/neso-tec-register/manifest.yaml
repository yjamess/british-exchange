transformations: Pin official CKAN CSV via resource_show download URL. One Observation
  per usable register row. Prefer value=MW Increase/Decrease with period=MW Effective
  From (date_basis=mw_effective_from_contractual). Built rows with blank Effective
  From use value=MW Connected and the register pin date (date_basis=built_connected_pin_snapshot).
  notes=plant_type=…; gate=1|2|unassigned; project_status=…; project_number=…; project_id=….
  Do not invent Gate values when blank.
revision_notes: Gate 3 B3 ingest — not Ready until Validation accepts.
caveats: Geography is GB (NESO), not UK. Gate may be blank until agreements are countersigned
  (published as gate=unassigned). Capacity across stages / technology types may duplicate
  under Connections Reform — do not sum Cumulative Total Capacity across stage rows
  without dedupe. MW Effective From is a contractual capacity date, not a speculative
  ETA. Built pin-snapshot rows are connected MW at the pin date, not queue ETAs. National
  DNO topology remains Blocked — this series is the connections queue only.
