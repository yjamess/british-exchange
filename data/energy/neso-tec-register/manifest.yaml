definition: 'Contracted Transmission Entry Capacity increments from the NESO TEC Register.
  Each curated row is one register line: value = MW Increase/Decrease; period = MW
  Effective From (contractual capacity date). Notes carry Gate (1/2/unassigned), plant
  type, project status, and project identifiers. Not speculative connection ETAs.
  Not a DNO topology atlas.'
