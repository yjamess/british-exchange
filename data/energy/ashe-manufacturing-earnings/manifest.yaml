caveats: Employee jobs only — not self-employed. Median ≠ mean. Full-Time ≠ All. Hourly
  excluding overtime ≠ gross hourly. Job-count column is indicative, not a reliable
  BRES/Workforce Jobs total. This pin is one year (2025 revised); multi-year change
  needs further editions. Cash pounds — real terms would restate with Economy CPIH
  and must be labelled.
