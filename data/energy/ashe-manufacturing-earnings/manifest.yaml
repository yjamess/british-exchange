transformations: Pin ASHE Table 4 zip (ashetable42025revised.zip). Extract 4.1a (weekly
  gross) and 4.6a (hourly excluding overtime). Parse All and Full-Time sheets. Keep
  Manufacturing section C and divisions 10–33 with published median values. Skip suppressed
  cells (:, x). Reference year 2025 (April pay period for weekly/hourly). Job counts
  are indicative only — stored in notes, not as values.
revision_notes: 2025 revised edition pin 2026-11-10. ASHE revises provisional years;
