transformations: Sheet 'Estimated Historical Generation'. Fuel columns only (total
  and share columns excluded); GWh ÷ 1000 → TWh. Each year's fuels are checked against
  the published total. Years before 1996 → observation_status=estimated; 1996+ → final.
  The published total is emitted as fuel=Total (aggregate).
revision_notes: ''
caveats: '1920–1995 are DESNZ estimates: published supply upscaled to generation and
  apportioned by fuel used. Before 1987 coverage is major power producers, transport
  undertakings and industrial hydro/nuclear only; 1987–1989 carry a high degree of
  estimation. Wind, wave, solar and hydro are one published group. Bioenergy sits
  in ''Other fuels'' (with coke oven gas, blast furnace gas, waste), not in the renewables
  group. Pumped storage includes battery storage. From 2017 the published total exceeds
  the sum of the fuel columns by 5–7 TWh (~2%; shares sum to ~0.98); the total is
  kept as fuel=Total (aggregate) and the residual is not allocated to any fuel. Fuel
  groups differ from ET 5.1; do not sum or splice the two series.'
