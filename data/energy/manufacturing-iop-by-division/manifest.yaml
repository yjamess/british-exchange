transformations: Download DIOP current CSV. Select explicit CDID catalogue of Section
  C subsection + division CVMSA series (exclude K22A). Keep monthly period rows only
  (YYYY MON). Map to ISO month bounds; geography K02000001. notes carry series=, classification=,
  sic=, label=. observation_status=provisional.
revision_notes: IoP revises each monthly release and at Blue Book / annual chain-linking.
  Base year moves with Blue Book. Re-pin DIOP CSV on re-ingest; compare checksums.
  Catalogue CDIDs are pinned in connector source — new ONS breaks need an explicit
  add.
caveats: 'SIC honesty: curated breaks are ONS-published CVMSA titles for subsections
  CA–CM and divisions 10–33. Divisions 11 and 12 are **not** published separately
  as CVMSA in DIOP; ONS publishes combined 11+12 (CDID DM4H) — labelled classification=combined_division.
  Finer group/class series (e.g. 10.1, 20A) and non-index series (weights, growth
  rates, turnover £m, NSA) are out of scope. Headline Section C (K22A) is Ready elsewhere.
  Index levels are not growth rates.'
