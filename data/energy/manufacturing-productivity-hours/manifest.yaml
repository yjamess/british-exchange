transformations: Download ONS timeseries JSON (DK3V/PRDY /data). Keep quarters only
  (annual aggregates omitted). Map year+Q→ISO calendar quarter bounds. Geography fixed
  to K02000001. Values = index 2023=100 SA; empty → missing. observation_status=provisional
  (PRDY revises).
revision_notes: Hours revise with labour-input and LFS/RTI revisions each PRDY release.
  Re-pin raw JSON on re-ingest; compare checksums.
caveats: Index of hours worked in manufacturing productivity accounts — not thousands
  of jobs (JWR7) and not ASHE paid hours. Do not divide IoP by this index to invent
  a private productivity series; use official DJK6 / DJ4P. National section C only.
