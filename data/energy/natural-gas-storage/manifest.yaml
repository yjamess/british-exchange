caveats: From 2016, stock data are sourced from National Grid and include medium-range,
  long-range and LNG stock; prior to 2016 LNG stock is not included (Note 1) — series
  break. Storage capacity also jumps around Rough / methodology changes; do not treat
  pre-/post-2016 as one continuous level without the break label. Distinct from gas-trade-by-partner
  (flows) and electricity storage / REPD. Never average with import dependency into
  one score. OGL v3.0.
