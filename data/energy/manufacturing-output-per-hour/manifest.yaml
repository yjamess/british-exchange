transformations: Download ONS timeseries JSON (DJK6/PRDY /data). Keep quarters only
  (annual aggregates omitted). Map year+Q→ISO calendar quarter bounds. Geography fixed
  to K02000001. Values = index 2023=100 SA; empty → missing. observation_status=provisional
  (PRDY revises).
revision_notes: Industry productivity revises with GDP(O)/GVA and labour-input revisions
  each PRDY release. Re-pin raw JSON on re-ingest; compare checksums.
caveats: Official ONS manufacturing productivity index — do not invent by dividing
  IoP by Workforce Jobs. Output per hour ≠ output per job (other PRDY CDIDs). Base
  year moves with Blue Book / PRDY rebasing. Annual rows in raw JSON are not curated.
  National section C only — not subsector or regional.
