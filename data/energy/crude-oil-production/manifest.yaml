transformations: Parse sheet 'Production, Imports & Exports'. Take Indigenous production
  Total column (thousand tonnes). Divide by 1000 → million tonnes. Emit one Observation
  per calendar year with a numeric Total. Blank pre-production years are omitted (not
  zeroed). Landward, feedstocks, imports, exports, and oil-product columns are not
  ingested in this hand-off.
revision_notes: Pinned Oil_Production_Trade_since_1890.xls (GOV.UK asset updated 30
  Jul 2026; retrieved 2026-11-07).
caveats: 'Sources sheet: years 1890–1920 include some extrapolated product trade;
  indigenous production Total begins later (~1920). Through 1962 indigenous production
  includes shale oil. Do not fabricate national totals from incomplete NSTA field
  maps. Unit conversion thousand tonnes → million tonnes is documented; native thousand
  tonnes remain in the pinned raw file.'
