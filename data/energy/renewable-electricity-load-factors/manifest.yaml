definition: 'UK annual load factors for renewable electricity generation from DUKES
  table 6.3: generation as a percentage of maximum possible generation. Two bases
  are published: (1) average of beginning- and end-of-year capacity [note 1]; (2)
  unchanged-configuration schemes [note 2]. Technology labels are taken from the sheet.
  Nuclear is not included — this is a renewables table only.'
