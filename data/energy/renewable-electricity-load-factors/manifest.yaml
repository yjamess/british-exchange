transformations: Parse sheet 6.3. For each of the two stacked tables, read year columns
  from the header row and emit one Observation per technology × year. notes=fuel=<Label>;
  basis=average_boe_capacity|unchanged_configuration. Publisher [x] → observation_status=missing
  with empty value. Parent aggregates (Wind, Hydro, Bioenergy, All renewable technologies)
  are retained alongside child technologies.
revision_notes: ''
caveats: Unit is percent (0–100 scale as published), not a 0–1 fraction. Do not confuse
  the two bases — prefer average_boe_capacity for headline Capacity ≠ Output unless
  the UI labels unchanged configuration explicitly. Nuclear load factors are in DUKES
  5.10 (MPP plant loads), not this series. REPD does not publish load factors and
  does not cover nuclear.
