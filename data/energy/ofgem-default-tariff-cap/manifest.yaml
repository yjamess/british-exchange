indicator_id: ofgem-default-tariff-cap
title: Ofgem default tariff (price) cap — GB typical £/year
sector: energy-industry
publisher: Ofgem
source_url: https://www.ofgem.gov.uk/energy-regulation/domestic-and-non-domestic/energy-pricing-rules/energy-price-cap/energy-price-cap-default-tariff-levels
series_id: Ofgem Annex 9 levelised default tariff cap (GB average, inc VAT)
geography: Great Britain (K03000001); not Northern Ireland
frequency: quarterly
unit: GBP per year (benchmark / typical consumption)
definition: Great Britain default tariff (price) cap levels for a typical domestic
  consumer, curated from Ofgem's per-period Annex 9 Levelisation Allowance model (sheet
  1a Levelised DTC). Values are GB-average, VAT-inclusive benchmark £/year under Other
  Payment Method (≈ direct debit), for electricity single-rate, gas, and dual-fuel
  (implied). Not DESNZ average bills (QEP 2.2.1 / 2.3.1) and not Northern Ireland.
