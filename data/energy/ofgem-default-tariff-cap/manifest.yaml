transformations: 'Electricity single-rate: parse Annex 9 sheet 1b Historical level
  tables (Other Payment Method · Typical consumption · Total inc VAT) for the full
  indicative timeline. Gas and dual-fuel: per-period 1a GB average,inc VAT from pinned
  Annex 9 workbooks. Record TDCV from sheet 1c on pin rows.'
revision_notes: Sheet 1b is an indicative levelised reconstruction. TDCV revised Jan
  2026 and Jul 2026 — compare periods carefully.
caveats: GB only — not NI. Cap ≠ actual average bills. Benchmark uses Ofgem TDCV,
  not DESNZ 3,400 / 11,200 kWh assumptions. Regional caps live in ofgem-default-tariff-cap-regional.
  Gas/dual history limited to pinned periods.
