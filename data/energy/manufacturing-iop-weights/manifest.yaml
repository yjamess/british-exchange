transformations: Read the pinned DIOP CSV. Select the explicit weight CDID for Section
  C and each curated SIC break (WEIGHT_CDID_BY_INDEX). Keep annual rows (YYYY). notes
  carry series= (the matching index CDID), weight_series=, classification=, sic=,
  label=. Fail if subsections or divisions stop summing to Section C within 1 part
  per thousand.
revision_notes: Weights change at annual chain-linking / Blue Book. Re-pin with the
  DIOP release used for manufacturing-iop-by-division.
caveats: Weights are shares of production value added, not volume. Share of manufacturing
  = branch weight ÷ Section C weight in the same year. ONS flagged in Oct 2025 that
  a release's GVA weights had not been updated to Blue Book 2025; re-check weights
  on each re-pin.
