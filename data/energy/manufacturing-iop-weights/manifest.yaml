series_id: DIOP-Section-C-Weights
geography: United Kingdom (K02000001)
frequency: annual
unit: parts per thousand of the Index of Production (GVA weight)
definition: 'ONS annual GVA weights used to combine the Index of Production, in parts
  per thousand of all production (IoP = 1000), for SIC 2007 Section C manufacturing
  (KM44), subsections CA–CM and divisions 10–33 (ONS combined 11+12). Additive: subsections
  and divisions each sum to Section C.'
