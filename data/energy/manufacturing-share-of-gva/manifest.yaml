  = calendar year. Geography K02000001. Latest year provisional (Blue Book
  revises). Raw weight retained in notes as weight_ppt=.
revision_notes: Industry weights revise with Blue Book. Recent years may be held constant
  until the next BB (check forward-filled years in raw). Re-pin raw JSON on re-ingest.
caveats: CVM industry weights ≠ current-price GVA share (levels can differ). Do not
  confuse with L4NU (Manufacturing+construction+services aggregate). Not a regional
  GVA share (Regions owns GVA by nation/region).
