transformations: Download BRES Table 4 XLSX for years 2019, 2020, 2021, 2022, 2023,
  2024. Per regional sheet, locate Manufacturing row; take Total employees / All (not
  Total employment). Map sheet titles to GSS codes; trim trailing spaces. Period =
  calendar year bounds. observation_status=provisional (survey revises).
revision_notes: Each reference year has provisional then revised editions. This pin
  uses revised for 2019–2023 and provisional for 2024. Re-pin when 2024 revised ships.
  Older 2015–2018 XLSX use strict OOXML that openpyxl cannot load — out of this pin.
caveats: 'CRITICAL: BRES **employee jobs** ≠ ONS Workforce Jobs (Ready manufacturing-employment
  / JWR7). Do not stitch or compare levels without a method note. Measure is Total
  employees (excludes working proprietors); Total employment is not curated. 2024
  provisional **excludes Northern Ireland** (ONS Information sheet) — GB regions only
  for that year. Figures rounded to nearest 100; * disclosive → missing/suppressed.
  PAYE-only units discontinuity is relevant for pre-2015 / finer NOMIS extracts —
  not in this 2019–2024 pin but must be labelled if the series is extended backwards.'
