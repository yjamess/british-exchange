caveats: Unit is Mtoe (not TWh). Nuclear and wind/solar/hydro use IEA heat content
  conventions (see workbook Note 7). Bioenergy & waste as a separate category from
  March 2014. fuel=Total is an aggregate — never sum with component fuels (API include_aggregates=false).
  Distinct from Domestic gas production (ET 4.x) and Historical coal (DUKES). GOV.UK
  asset URLs change each release; pin checksummed raw.
