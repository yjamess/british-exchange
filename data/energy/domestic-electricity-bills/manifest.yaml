transformations: 'Parse sheet 2.2.1 only (Standard Electricity, 3,400 kWh). Long-format:
  one CSV row per year × payment × tariff with value. Blank Fixed/Variable cells for
  2014–2021 omitted (not published). Geography coded as UK (K02000001). Economy 7
  / financial-year / historic-consumption sheets not ingested in this indicator.'
revision_notes: table_221__1_.xlsx Cover Sheet publication date 30/06/2026 (QEP June
  2026 domestic bills update).
caveats: Bills use fixed DESNZ consumption assumptions (3,400 kWh from 2024; historic
  sheets used 3,600 kWh — not mixed into this series). Not the same as Ofgem Typical
  Domestic Consumption Values (TDCV). Incorporates Energy Price Guarantee from Oct
  2022 but excludes Energy Bills Support Scheme £200. Fixed vs Variable tariff split
  is official statistics in development. Distinct from industrial QEP 3.1.2 (p/kWh,
  GB manufacturing). Do not equate with Ofgem price-cap levels (unit rates/standing
  charges, GB regions).
