transformations: 'Parse sheet 4.5a header row 6. Long-format: one CSV row per flow
  × mode × partner × year. Strip [note N] from labels. Omit ordinary partner zeros.
  Sheet 4.5b (facility capacity mm3/day) not ingested — static register, not annual
  trade flows.'
revision_notes: 'DUKES_4.5.xlsx published 30 July 2026; years 2000–2025. Cover Sheet:
  revisions 1998–2024; 2025 LNG origin corrections (Brazil/Mexico → USA).'
caveats: Partner labels are statistical country of origin/destination — not a pipeline
  landfall atlas (Langeled/BBL endpoints live only on 4.5b as descriptive text). From
  2016 LNG methodology break (Note 2). Belgium pipeline note covers Bacton-Zeebrugge
  physical flows (Note 1). LNG Reloads are re-exports, not UK liquefaction (Note 4).
  Negative Net imports = net exporter (Note 5). Distinct from lng-imports-by-terminal
  (facility volumes) and energy-imports-and-exports (ET 1.3 all-fuels ktoe). OGL v3.0.
