# Railway deploy for the FastAPI observation API (not the Next.js app in web/).
# Docs: https://docs.railway.com/deployments/start-command
# Required variables: DATABASE_URL (Supabase Postgres), SUPABASE_URL +
# SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY (Storage packs via GET /packs).
# BX_REQUIRE_POSTGRES is implied by RAILWAY_* — /health returns 503 without Postgres.
[deploy]
startCommand = "uv run uvicorn britain_exchange.api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
