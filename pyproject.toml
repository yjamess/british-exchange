[project]
name = "british-exchange"
version = "0.1.0"
description = "The Britain Exchange — UK public data observatory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.7",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/britain_exchange",
    "src/energy",
    "src/economy",
    "src/housing",
    "src/people",
    "src/government",
    "src/infrastructure",
    "src/regions",
    "src/history",
    "src/validation",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
